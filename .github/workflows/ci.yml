name: CI

on:
  pull_request:
    # `epic/**` keeps CI running for work that accumulates on a long-lived
    # integration branch instead of landing on main one PR at a time. Without
    # it a stacked epic gets NO checks until the whole thing merges — which is
    # exactly backwards, since the point of holding work off main is to prove
    # it carries no regressions first.
    branches: [main, "epic/**"]
    paths:
      - "src/**"
      - "crates/**"
      # The conformance suite lives here. Without it a PR that only touches
      # `tests/` triggers no run at all, so its required check never reports
      # and the PR is blocked forever — and a change that broke the suite
      # would reach main unexamined.
      - "tests/**"
      - "charts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "docker/**"
      - "docker-bake.hcl"
      - "hack/**"
      - "scripts/**"
      - "apt_config/**"
      - "nix/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/package-publish.yml"
      - ".github/workflows/publish-crates.yaml"
  # Releases are cut by pushing a `v*` tag — NOT by publishing a GitHub Release
  # by hand. `_release-rust.yml` creates the Release itself as a DRAFT, attaches
  # every signed asset, and only then flips it to published. That ordering is
  # mandatory now that immutable releases are enabled on this repo: a published
  # immutable release has its assets and tag LOCKED, so nothing can be uploaded
  # to it afterwards.
  #
  # Deliberately NOT `release: [published]`:
  #   - Publishing a Release by hand would create it *published*, so release-cli
  #     would upload into a locked release and fail.
  #   - The draft→publish transition the shared workflow performs fires its own
  #     `release: published` event; if this workflow also listened for it,
  #     release-cli would re-run against the now-published release and fail.
  # package-publish.yml / publish-crates.yaml DO still listen for
  # `release: published` — that is the intended cascade, and it is why the
  # publish is done with GH_PAT_KUNOBI_NINJA_RELEASES rather than GITHUB_TOKEN
  # (GitHub suppresses workflow triggers for events raised by GITHUB_TOKEN).
  #
  # No `paths:` filter here: it applies to tag pushes too, and a tag push
  # carries no file diff, so a filtered `push` would silently never fire the
  # release. Mirrors kache's trigger block.
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  # Nightly trigger for the slow privileged-k3s e2e gate (see the `e2e` job).
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust Checks
    runs-on: kunobi-runners
    container:
      # Toolchain floor is driven by `kunobi-ha` (≥ 1.94 since kunobi-ha
      # repointed its MSRV in their #6). Bump together with that crate
      # whenever a newer stable lands; kobe itself only requires the
      # `rust-version` declared in Cargo.toml.
      image: rust:1.94-bookworm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      # `cache: false` meant every single run re-downloaded bun, so one bad
      # minute on the tool host took the whole required check down — as it did
      # on 2026-08-12, when `mise install bun` failed instantly with an HTTP/2
      # `refused stream` on every branch for the better part of an hour and
      # nothing could merge. The tool is version-pinned in mise.toml, so the
      # cache key is exact and a hit is the normal path.
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: true

      # Retried separately rather than via `install_args`: a transient refusal
      # on the download is not a reason to fail a Rust check, and the action
      # itself has no retry. Bounded — three attempts, then the failure is
      # real and the log shows all of them.
      - name: Install bun for the E2E harness tests
        run: |
          for attempt in 1 2 3; do
            if mise install bun; then exit 0; fi
            echo "::warning::bun install attempt ${attempt} failed; retrying"
            sleep $((attempt * 15))
          done
          echo "::error::bun could not be installed after 3 attempts"
          exit 1

      - name: Lint and test E2E harness
        run: |
          mise exec -- bunx @biomejs/biome@2.3.11 lint --only=correctness/noUndeclaredVariables hack/*.ts
          mise exec -- bun test ./hack/e2e.test.ts

      - name: Add Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        # --workspace so the kobectl member is linted too (not just the operator).
        run: cargo clippy --workspace -- -D warnings

      - name: Tests
        # Sandbox admission/teardown tests poll deeply nested futures on the
        # libtest thread; the default 2MiB spawned-thread stack overflows in
        # Linux debug builds ("fatal runtime error: stack overflow"). Match
        # the 8MiB the production runtime workers are configured with.
        env:
          RUST_MIN_STACK: "8388608"
        run: cargo test --workspace

      # The release gate itself only runs on tag pushes (version-consistency),
      # which is the right place for it — but that means its parsing logic is
      # otherwise unexercised until a release is being cut. These tests run on
      # every change so a regression in the gate surfaces here instead.
      - name: Version-consistency gate tests
        run: ./scripts/test-version-consistency.sh

      # Same reasoning: the -git pkgver is only ever visible as AUR metadata,
      # so a wrong value publishes cleanly and no build ever fails on it.
      - name: AUR -git pkgver tests
        run: ./scripts/aur/test-vcs-pkgver.sh

      # RUSTSEC-2026-0258 (h2 unbounded empty DATA frames) hits two h2 versions
      # in this tree, and only one of them can be fixed today:
      #
      #   h2 0.4.x — OUR stack (hyper/kube, and the operator's own HTTP server,
      #              which is where an untrusted peer could actually send these
      #              frames). Fixed: pinned to 0.4.16 in Cargo.lock.
      #   h2 0.3.x — reached only through the AWS SDK
      #              (aws-config / aws-sdk-s3 -> aws-smithy-http-client), used
      #              as a CLIENT against AWS endpoints. The advisory publishes
      #              no patched 0.3 release, and even the newest
      #              aws-smithy-http-client (1.3.0) still depends on 0.3, so
      #              there is nothing to upgrade to. Revisit when the AWS SDK
      #              moves off h2 0.3.
      #
      # `cargo audit` ignores by advisory ID, not by version, so the ignore
      # below would ALSO mask a regression on the 0.4 line we just fixed. The
      # explicit floor check runs first so that cannot happen silently.
      - name: Security audit
        run: |
          python3 - <<'EOF'
          import re, sys
          versions = re.findall(r'name = "h2"\nversion = "([^"]+)"', open('Cargo.lock').read())
          stale = [v for v in versions
                   if v.startswith('0.4.')
                   and tuple(int(p) for p in v.split('.')) < (0, 4, 16)]
          if stale:
              print(f"::error::h2 {stale} is below 0.4.16 (RUSTSEC-2026-0258)")
              sys.exit(1)
          print(f"h2 floor check OK: {versions}")
          EOF
          cargo install cargo-audit --locked || true
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2026-0002 \
            --ignore RUSTSEC-2026-0097 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0258

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Verify Helm chart renders
        run: |
          helm dependency build charts/kobe/
          helm template kobe charts/kobe/ --debug > /dev/null
          helm lint charts/kobe/ --set agentSandbox.mode=external
          helm template kobe charts/kobe/ \
            --set agentSandbox.mode=external \
            --debug > /dev/null
          mise exec -- bun run hack/test-agent-sandbox-chart.ts

      - name: Verify CRDs match generated output
        run: |
          # Derive the gate from the shipped chart instead of maintaining a
          # second list that can silently omit a new CRD.
          for crd_path in charts/kobe/crds/*.yaml; do
            crd="${crd_path##*/}"
            crd="${crd%.yaml}"
            cargo run --quiet --bin crdgen -- "$crd" > "/tmp/${crd}-generated.yaml"
            diff -u "/tmp/${crd}-generated.yaml" "$crd_path" || {
              echo "::error::CRD '${crd}' is out of date. Run 'cargo run --bin crdgen -- ${crd} > charts/kobe/crds/${crd}.yaml' to update."
              exit 1
            }
          done

  lifecycle-state-machine:
    name: Lifecycle State Machine (Kani + mutations)
    runs-on: kunobi-runners
    # Bare ARC runners intentionally carry no compiler/linker. Use the same
    # build environment as the main Rust gate so installing Kani has `cc`.
    container:
      image: rust:1.94-bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The pure crate deliberately supports Rust 1.93: Kani 0.67's verifier
      # toolchain is one release behind Kobe's 1.94.1 operator MSRV. The
      # operator imports this exact function, so the proof cannot drift into a
      # second model that production never calls.
      # The upstream composite action executes its installer from the ARC host
      # action path, which is not mounted into job containers. Install the same
      # pinned verifier directly so the proof runs in the controlled image.
      - name: Install pinned Kani verifier
        run: |
          cargo install kani-verifier --version 0.67.0 --locked
          cargo-kani setup

      - name: Prove exact-binding recovery invariants
        run: |
          cargo kani \
            -p kobe-state-machine \
            --harness recovery_apply_requires_the_exact_leased_subject \
            --harness teardown_phases_are_never_reopened_by_recovery \
            --harness bound_publication_requires_two_exact_reciprocal_sides \
            --harness terminal_leases_never_publish_bound

      # Mutation testing checks the tests themselves: every viable mutation of
      # a production decision branch must be caught. Keep this narrow so it is
      # a seconds-scale required gate rather than a second workspace test run.
      - name: Mutation-test every recovery decision branch
        run: |
          if ! command -v cargo-mutants >/dev/null 2>&1; then
            cargo install cargo-mutants --version 27.0.0 --locked
          fi
          cargo mutants \
            -p kobe-state-machine \
            --re 'exact_binding_(recovery|finalization)' \
            --timeout 60

  # Real API-server contract for SandboxLease status and the admission ledger.
  # Unit tests pin JSON Patch/CEL/object shape; this job proves Kubernetes
  # rejects stale status writers, release-cause mutation, tenant reservation
  # writes, and namespace object growth beyond the configured quota. No Kobe
  # image, Helm release, or external Agent Sandbox runtime is involved.
  sandbox-apiserver-contract:
    name: Sandbox API-server Contract
    runs-on: kunobi-runners
    timeout-minutes: 15
    env:
      SANDBOX_CONTRACT_CLUSTER: sandbox-api-${{ github.run_id }}-${{ github.run_attempt }}
      # The `runner` context is unavailable while GitHub evaluates job-level
      # env. The run/attempt pair still makes this host path unique.
      KUBECONFIG: /tmp/sandbox-api-${{ github.run_id }}-${{ github.run_attempt }}.kubeconfig
    steps:
      - uses: actions/checkout@v7

      - name: Set up pinned contract-test tools
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: true

      - name: Install bun, Helm, kind and kubectl
        run: mise install bun helm kind kubectl

      - name: Create kind and install the contract CRDs
        run: |
          mise exec -- kind create cluster --name "$SANDBOX_CONTRACT_CLUSTER" --wait 120s
          CONTEXT="kind-$SANDBOX_CONTRACT_CLUSTER"
          mise exec -- kubectl --context "$CONTEXT" apply \
            -f charts/kobe/crds/clusterinstances.yaml \
            -f charts/kobe/crds/clusterleases.yaml \
            -f charts/kobe/crds/sandboxleases.yaml \
            -f charts/kobe/crds/sandboxpools.yaml \
            -f charts/kobe/crds/verifiedteardownevidence.yaml
          mise exec -- kubectl --context "$CONTEXT" wait \
            --for=condition=Established \
            crd/clusterinstances.kobe.kunobi.ninja \
            crd/clusterleases.kobe.kunobi.ninja \
            crd/sandboxleases.kobe.kunobi.ninja \
            crd/sandboxpools.kobe.kunobi.ninja \
            crd/verifiedteardownevidence.kobe.kunobi.ninja \
            --timeout=60s

      - name: Materialize pinned Helm dependency
        run: mise exec -- helm dependency build charts/kobe/

      - name: Verify SandboxLease fences and admission-ledger isolation
        run: |
          export KOBE_SANDBOX_APISERVER_CONTEXT="kind-$SANDBOX_CONTRACT_CLUSTER"
          mise exec -- bun run ./hack/test-sandbox-apiserver.ts

      - name: Verify split teardown-authority isolation
        run: |
          export KOBE_SANDBOX_APISERVER_CONTEXT="kind-$SANDBOX_CONTRACT_CLUSTER"
          mise exec -- bun run ./hack/test-teardown-authority-apiserver.ts

      - name: Tear down contract cluster
        if: always()
        run: mise exec -- kind delete cluster --name "$SANDBOX_CONTRACT_CLUSTER" || true

  # Proves the pinned release fixture against a real cluster: a live warm
  # Claim survives the operator-side v0.5.6 -> v1.0.0 rollout, then the pinned
  # controller and exact Claim -> Sandbox -> Pod lifecycle are healthy without
  # a conversion webhook. The script owns a uniquely named Kind cluster and
  # refuses to reuse one.
  sandbox-runtime-contract:
    name: Agent Sandbox Runtime Contract
    runs-on: kunobi-runners
    timeout-minutes: 20
    env:
      SANDBOX_RUNTIME_CLUSTER: sandbox-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up pinned runtime-contract tools
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: true

      - name: Install bun, kind and kubectl
        run: mise install bun kind kubectl

      - name: Install Helm and chart dependencies
        uses: azure/setup-helm@v5

      - name: Upgrade and exercise the pinned v1.0.0 runtime
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build charts/kobe/
          mise exec -- bun run ./hack/test-agent-sandbox-runtime.ts

      # A force-cancel can prevent the script's own finally-style cleanup. Only
      # delete when the exact cluster presents the ownership marker written by
      # this run; a collision or unrelated cluster is deliberately untouched.
      - name: Recover an interrupted contract cluster
        if: always()
        run: |
          CONTRACT_KUBECONFIG="$RUNNER_TEMP/$SANDBOX_RUNTIME_CLUSTER.kubeconfig"
          CONTRACT_CONTEXT="kind-$SANDBOX_RUNTIME_CLUSTER"
          MARKER="$(mise exec -- kubectl \
            --kubeconfig "$CONTRACT_KUBECONFIG" \
            --context "$CONTRACT_CONTEXT" \
            --request-timeout=5s \
            get namespace kobe-runtime-contract \
            -o jsonpath='{.metadata.labels.kobe\.kunobi\.ninja/contract-cluster}' \
            2>/dev/null || true)"
          if [ "$MARKER" = "$SANDBOX_RUNTIME_CLUSTER" ]; then
            mise exec -- kind delete cluster \
              --name "$SANDBOX_RUNTIME_CLUSTER" \
              --kubeconfig "$CONTRACT_KUBECONFIG"
          elif [ -n "$MARKER" ]; then
            echo "::warning::Refusing cleanup: ownership marker is $MARKER"
          fi

  docker-dry-run:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: kunobi-runners
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Authenticated pulls avoid Docker Hub's anonymous rate limit (~100/6h per
      # IP), which the shared self-hosted runner egress IP intermittently trips —
      # surfacing as a 429 on the base-image pull. `publish` already logs in; the
      # dry-run did not. `continue-on-error` keeps fork PRs (no secrets) working
      # via anonymous pulls, exactly as before.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Asserts what each tag MEANS (latest = newest release, dev = head of
      # main, sha-<7> = that commit) by resolving `bake --print` under all three
      # publish shapes. Resolution only — no build, no push — so it is seconds,
      # and it runs on PRs where `publish` never does: the one place a tagging
      # regression can still be caught before it reaches the registry.
      - name: Verify image tag semantics
        run: ./scripts/test-tag-semantics.sh

      - name: Build all images (dry-run, no cache)
        run: docker buildx bake -f docker-bake.hcl --set '*.cache-from='

  # Backend-agnostic conformance gate (#164), run PER BACKEND so "passes
  # conformance" is provable for each rather than k3s-only. Every leg exercises
  # the real Helm chart (real rbac.yaml) against a REAL cluster nested-in-pod
  # inside plain kind — which is what catches the readiness-probe class of
  # regression (members never go Ready) that unit tests cannot.
  #
  # The legs are NOT equivalent, and it is worth being precise about it:
  #   - k3s runs `hack/test-e2e-k3s.ts`: provision -> Ready -> recycle, and it
  #     asserts teardown completed and left no orphaned data PVC. That is the
  #     leg that covers the RBAC-403 recycle-wedge class (stuck Recycling).
  #   - every other leg runs the generic `hack/test-smoke.ts`: provision ->
  #     Ready -> lease -> API reachable -> release. It does NOT wait for or
  #     assert recycle, so it does not cover the recycle-wedge class.
  # Extending the generic smoke to assert teardown would make the matrix
  # uniform; until then, read a green non-k3s leg as "provisions and serves",
  # not "provisions, serves and reaps".
  #
  # Kept as one dedicated matrix job (cf. how kunobi-ninja/kache#487 kept its
  # audit gate a dedicated, scoped job) — each leg owns an isolated kind cluster
  # (name suffixed by backend) and always tears it down. `fail-fast: false` so
  # one backend's failure doesn't mask the others.
  #
  # PHASE 2 (#10): the k3s leg — the production backend — runs on every PR,
  # push to main and release tag, so a conformance regression is caught before
  # merge and again at the release boundary instead of a day later.
  # The full matrix (k3s + both vkobe datastores) stays nightly + manual; the
  # vkobe legs run the same gate across etcd + kine/sqlite, vcluster runs
  # nightly against the upstream loft-sh chart (#31), and k0s joins with the
  # same on-demand shape (#65) — single-server only, since servers>1 is still
  # rejected for that backend (#7). capi remains out: no CI infrastructure
  # provider yet;
  # `backend_conformance_coverage_is_classified` (crd/profile.rs)
  # forces every new BackendType to be consciously classified against this
  # matrix. Since #28, reaching Ready on k3s/k0s/vcluster requires the
  # functional admission gates (DNSHealthy + InClusterToken), so every leg
  # that provisions to Ready exercises them end-to-end. Deliberately NOT in
  # `publish.needs` yet: a flaky e2e must not block an urgent release —
  # promote once the main-push signal proves stable. No `container:` block:
  # like `docker-dry-run`, this needs the host Docker socket for kind + buildx.
  conformance:
    if: >-
      ${{ github.event_name == 'pull_request'
          || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
          || (github.event_name == 'push'
              && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    needs: [checks]
    runs-on: kunobi-runners
    timeout-minutes: 180
    # The vkobe backend is ON HOLD (see docs/kobe-docs/how-it-works/
    # runtime-strategy.mdx) and its legs currently fail on a real behavior
    # tracked in #36 (pool creates no members in the kind harness). Keep them
    # RUNNING — per-leg status and logs stay visible — but only the k3s
    # (production) leg fails the run, so the nightly/tag signal is not
    # permanent red noise while vkobe is paused. Drop this when #36 is fixed.
    continue-on-error: ${{ matrix.backend != 'k3s' }}
    strategy:
      fail-fast: false
      matrix:
        # k3s-only on PR/push (fast feedback on the production backend); the
        # full backend matrix remains nightly / manual.
        backend: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '["k3s"]' || '["k3s", "vkobe-etcd", "vkobe-kine", "vcluster", "k0s"]') }}
    env:
      E2E_CLUSTER: e2e-${{ github.run_id }}-${{ matrix.backend }}
      KOBE_ENDPOINT: http://127.0.0.1:8080
      KOBE_TOKEN: e2e-dev-token
      KOBE_TOKEN_OTHER: e2e-other-token
      KOBE_SANDBOX_POOL_MANAGEMENT: e2e-sandbox-management-trusted
      KOBE_SANDBOX_POOL_CHILD: e2e-sandbox-child-k3s-trusted
      KOBE_SANDBOX_HARNESS: bun run ./hack/e2e.ts
      KOBE_BIN: ${{ github.workspace }}/target/debug/kobe
    steps:
      - uses: actions/checkout@v7

      # Provides bun + helm + kind + just + kubectl (and rust, per mise.toml).
      # The e2e harness resolves these via `mise which`, and `just` runs the
      # recipe.
      - name: Set up mise tools
        uses: jdx/mise-action@v4

      # The vkobe smokes build the `kobe` CLI from source (cargo run -p
      # kobectl), which needs a host C toolchain for proc-macro build scripts —
      # the runner image stopped shipping one (#34). Guarded: no-op when cc
      # already exists.
      - name: Ensure C toolchain for the smoke CLI build
        run: |
          if ! command -v cc >/dev/null 2>&1; then
            (sudo apt-get update -qq && sudo apt-get install -y -qq build-essential) \
              || (apt-get update -qq && apt-get install -y -qq build-essential)
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Per-backend kind cluster name (run id + backend) so concurrent legs and
      # persistent self-hosted runs never collide on a shared cluster name.
      - name: Bring up the e2e harness (kind + chart + pools)
        # `--backend` only selects which guest images are worth pre-loading;
        # every pool is applied regardless. Scale-to-zero pools provision only
        # in their own leg, so pre-loading their images in every leg would be a
        # pull each other leg never uses.
        run: |
          SANDBOX_ARGS=()
          if [ "${{ matrix.backend }}" = k3s ]; then
            SANDBOX_ARGS+=(--sandbox-conformance)
          fi
          mise exec -- bun run ./hack/e2e.ts up \
            --cluster "$E2E_CLUSTER" \
            --backend "${{ matrix.backend }}" \
            "${SANDBOX_ARGS[@]}"

      # The smoke recipes differ by backend (k3s takes the cluster name; the
      # vkobe recipes target their pool against the current kind context).
      - name: Run the ${{ matrix.backend }} conformance smoke gate
        run: |
          case "${{ matrix.backend }}" in
            k3s)        mise exec -- just test-smoke-k3s "$E2E_CLUSTER" ;;
            vkobe-etcd) mise exec -- just test-smoke-vkobe ;;
            vkobe-kine) mise exec -- just test-smoke-vkobe-kine ;;
            vcluster)   mise exec -- just test-smoke-vcluster ;;
            k0s)        mise exec -- just test-smoke-k0s ;;
            *) echo "unknown backend ${{ matrix.backend }}" >&2; exit 1 ;;
          esac

      # Dual-placement Sandbox conformance (#76). Runs only on the k3s leg:
      # child placement REQUIRES a receipt-capable k3s pool, so the other
      # backends have nothing to compare against and would report a skip that
      # reads as a pass.
      #
      - name: Sandbox conformance (management + child)
        if: matrix.backend == 'k3s'
        run: |
          mise exec -- cargo build -p kobectl --bin kobe
          mise exec -- bun run ./hack/e2e.ts sandbox-conformance-preflight \
            --cluster "$E2E_CLUSTER" \
            --timeout 900
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            mise exec -- just test-sandbox-conformance
          else
            mise exec -- just test-sandbox-conformance-pr
          fi

      # After BOTH gates: a `failure()` step placed before a step is skipped
      # for good once execution passes it, so sitting between the smoke gate
      # and the Sandbox gate left the Sandbox gate's failures with no
      # diagnostics at all.
      - name: Diagnostics on failure
        if: failure()
        run: |
          CTX=kind-$E2E_CLUSTER
          kubectl --context "$CTX" get pods,clusterinstances,clusterpools,sandboxpools,sandboxleases -A -o wide || true
          kubectl --context "$CTX" get sandboxpools -A -o yaml || true
          # Answer the RBAC question a 403 leaves open: which identity, which
          # verb. The operator's SA is the only identity the canary execs with.
          SA="$(kubectl --context "$CTX" get deploy -n kobe-system -l app.kubernetes.io/name=kobe -o jsonpath='{.items[0].spec.template.spec.serviceAccountName}' 2>/dev/null || true)"
          if [ -n "$SA" ]; then
            for verb in get create; do
              echo "auth can-i $verb pods/exec as system:serviceaccount:kobe-system:$SA:"
              kubectl --context "$CTX" auth can-i "$verb" pods --subresource=exec \
                --as "system:serviceaccount:kobe-system:$SA" -A || true
            done
          fi
          kubectl --context "$CTX" get clusterrole -o yaml 2>/dev/null | grep -B6 -A6 "pods/exec" || true
          # can-i answers authorization only; admission and the kubelet leg can
          # still 403 an allowed request. Reproduce the canary's actual exec —
          # -v=8 prints the response body, which names the real denier.
          POD="$(kubectl --context "$CTX" get pods -n kobe-system -o name 2>/dev/null | grep 'kobe-e2e-sandbox-management' | head -1)"
          if [ -n "$POD" ]; then
            echo "probe exec as admin into $POD:"
            kubectl --context "$CTX" exec -n kobe-system "$POD" -c workspace -v=8 -- /bin/true 2>&1 | tail -30 || true
            echo "probe exec as the operator SA into $POD:"
            kubectl --context "$CTX" exec -n kobe-system "$POD" -c workspace -v=8 \
              --as "system:serviceaccount:kobe-system:${SA:-kobe}" -- /bin/true 2>&1 | tail -30 || true
          fi
          kubectl --context "$CTX" logs -n kobe-system -l app.kubernetes.io/name=kobe --tail 400 --all-containers || true
          mkdir -p /tmp/kind-logs
          mise exec -- kind export logs /tmp/kind-logs --name "$E2E_CLUSTER" || true

      - name: Upload kind logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kind-logs-${{ github.run_id }}-${{ matrix.backend }}
          path: /tmp/kind-logs
          if-no-files-found: ignore

      # Always tear down so kind clusters never leak on the persistent runner.
      - name: Tear down the e2e harness
        if: always()
        run: mise exec -- bun run ./hack/e2e.ts down --cluster "$E2E_CLUSTER"

  publish:
    # Pushes the operator/sync container images. On a RELEASE TAG, gate the image
    # push on version-consistency too, so a tag that disagrees with the manifest
    # can't ship images while release-cli + crates are blocked. On push-to-main
    # (where version-consistency is skipped) keep publishing as before.
    #
    # The REF gate is load-bearing: this job used to key only off
    # `event_name != 'pull_request'`, so `workflow_dispatch` on ANY branch
    # published from that branch. Dispatch is the documented way to exercise
    # the full backend and exhaustive Sandbox matrices before merging a backend
    # change — so validating a branch must not republish shared tags from
    # unmerged code. Validation and publication are separate concerns:
    # dispatch a branch to test it, and only main / a release tag ships.
    # Dispatch on main still publishes, which is the remedy for tags left
    # pointing somewhere wrong.
    needs: [checks, lifecycle-state-machine, version-consistency]
    if: >-
      ${{ always() && github.event_name != 'pull_request'
          && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
          && needs.checks.result == 'success'
          && needs['lifecycle-state-machine'].result == 'success'
          && (!startsWith(github.ref, 'refs/tags/v') || needs['version-consistency'].result == 'success') }}
    runs-on: kunobi-runners
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          VERSION: ${{ steps.version.outputs.version || '0.0.0' }}
          # `dev` means head of main, so only a main build claims it. A release
          # run sends IMAGE_TAG empty and publishes latest + the semver tags
          # alone (see the `tags` function in docker-bake.hcl), leaving `dev`
          # where it was until main next moves.
          IMAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && '' || 'dev' }}
          BUILD_VERSION: ${{ github.ref_name || 'dev' }}
          BUILD_COMMIT: ${{ github.sha }}
        run: docker buildx bake -f docker-bake.hcl push

  # Pushes the Helm chart as an OCI artifact, from the SAME `v*` tag as the
  # image — the chart is versioned with the operator (Chart.yaml `version:` ==
  # `appVersion:` == the workspace version, enforced by version-consistency), so
  # there is no second tag to remember and no way to publish a chart whose
  # appVersion points at an image that was never built:
  #   - `needs: version-consistency` proves tag == Chart.yaml version + appVersion
  #   - `needs: publish` proves the operator image for that version was pushed in
  #     THIS run, which is why no registry probe is needed here
  # Tag-only: a push to main must not publish a chart version that is already
  # released (chart versions are immutable in the registry).
  publish-chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version-consistency, publish]
    runs-on: kunobi-runners
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Package & push Helm chart (OCI)
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          helm registry login registry-1.docker.io -u "$DOCKERHUB_USER" -p "$DOCKERHUB_TOKEN"
          helm dependency build charts/kobe
          helm package charts/kobe
          helm push kobe-*.tgz oci://registry-1.docker.io/zondax

  # Fail-closed version gate: on a release, the tag must agree with the
  # workspace manifest version and Chart.yaml BEFORE any binary is built,
  # signed, or published to crates.io. Hermetic (manifest reads only).
  version-consistency:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: kunobi-runners
    container:
      image: rust:1.94-bookworm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check tag == manifests
        run: ./scripts/check-version-consistency.sh "${{ github.ref_name }}"

  # Builds the kobe CLI (the `kobectl` member's `kobe` binary) for 6 targets,
  # SIGNS them (macOS codesign+notarize, Windows code signing, Linux PGP via
  # GCP-KMS), builds the Debian .deb assets, and attaches everything to the
  # GitHub release. Consumed by:
  #   - mise (ubi) / `gh release download` / cargo-binstall — prebuilt tarballs
  #   - package-publish.yml — apt (.deb), brew (.sha256), winget (.exe)
  #
  # Mirrors kache's `release` job (same shared reusable workflow + same shared
  # Kunobi signing identity). Differences vs kache: kobe is a WORKSPACE, so
  # `build_args` scopes the cross-build to `-p kobectl --bin kobe` (this also
  # keeps the operator's `aws-lc-sys` out of the Windows tree, which is what
  # makes the msvc cross-build viable), and `deb_package: kobectl` tells
  # cargo-deb which member to package.
  #
  # Pinned to _workflows@v11 — the first tag carrying the generic-deb change
  # (Zondax/_workflows#109: `deb_package` input + binary_name-based deb naming,
  # which defaults to kache so the change is a strict no-op for existing
  # consumers). This job will not function until that PR is merged and v11 is cut.
  release-cli:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, version-consistency]
    # IN-ORG MIRROR of zondax/_workflows@7f61511 (v11) — a byte-identical import;
    # the tag `v11` resolved to that same content, so this is a no-op for kobe.
    #
    # It exists because a runner group's workflow allowlist matches the workflow
    # a job is DEFINED in (not the caller), and an org-owned group cannot name a
    # workflow from another org. While kache pointed at `zondax/`, its macOS
    # signing jobs could not be authorized by any allowlist entry and queued
    # forever against idle runners with no error. kobe does not use those
    # runners today, but it shares this workflow — moving both keeps the two
    # release paths identical and lets kobe adopt signing later without a
    # second migration. See kunobi-ninja/_workflows for the rationale and the
    # maintenance contract (the pin and the allowlist must move together).
    uses: kunobi-ninja/_workflows/.github/workflows/_release-rust.yml@ee8dc66895f75bf79c8fa4c87e06aaeb752e7db5 # v1
    with:
      binary_name: kobe
      build_args: -p kobectl --bin kobe
      deb_package: kobectl
      # Build .deb assets (kobe_<version>_{amd64,arm64}.deb) for the apt repo.
      build_deb: true
      # Publish the bare signed kobe.exe per Windows arch (kobe-<triple>-pc-windows-msvc.exe)
      # as a first-class asset so winget installs it as InstallerType: portable.
      upload_windows_exe: true
      # 6 targets incl. both Windows msvc arches, cross-built on Linux via
      # cargo-xwin (no native Windows runner). The slim kobectl tree uses the
      # `ring` rustls provider (NOT aws-lc-sys), so the arm64 msvc build links.
      targets: '["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]'
      extra_build_env: |
        BUILD_VERSION=${{ github.ref_name }}
        BUILD_COMMIT=${{ github.sha }}
        # Statically link the MSVC CRT so the .exe runs without the VC++
        # Redistributable (winget validation VMs lack it). Applied per-triple.
        CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static
        CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS=-C target-feature=+crt-static
      # --- GCP-KMS code signing (reuses the shared CODESIGN_*/PGP_SIGN_* identity) ---
      enable_signing: true
      notarize_macos: true
      jsign_sha256: ${{ vars.JSIGN_SHA256 }}
      rcodesign_sha256: ${{ vars.RCODESIGN_SHA256 }}
    secrets:
      pgp_cert_base64: ${{ secrets.PGP_CERT_BASE64 }}
      pgp_signer_token: ${{ secrets.GH_PAT_KUNOBI_NINJA_RELEASES }}
      windows_cert_chain: ${{ secrets.CODESIGN_CERT_CHAIN }}
      codesign_wif_provider: ${{ secrets.CODESIGN_WIF_PROVIDER }}
      codesign_gcp_project: ${{ secrets.CODESIGN_GCP_PROJECT }}
      codesign_service_account: ${{ secrets.CODESIGN_SERVICE_ACCOUNT }}
      codesign_kms_keyring: ${{ secrets.CODESIGN_KMS_KEYRING }}
      codesign_kms_key_alias: ${{ secrets.CODESIGN_KMS_KEY_ALIAS }}
      pgp_sign_wif_provider: ${{ secrets.PGP_SIGN_WIF_PROVIDER }}
      pgp_sign_gcp_project_id: ${{ secrets.PGP_SIGN_GCP_PROJECT_ID }}
      pgp_sign_service_account: ${{ secrets.PGP_SIGN_SERVICE_ACCOUNT }}
      pgp_sign_kms_key_version: ${{ secrets.PGP_SIGN_KMS_KEY_VERSION }}
    permissions:
      contents: write
      id-token: write
