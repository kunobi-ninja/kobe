apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kobe.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.poolPublisherServiceAccount | default (printf "%s-pool-publisher" (include "kobe.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kobe.fullname" . }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
rules:
  # CRD management
  - apiGroups: ["kobe.kunobi.ninja"]
    resources:
      - clusterpools
      - clusterpools/status
      - clusterinstances
      - clusterinstances/status
      - clusterleases
      - clusterleases/status
      - accesspolicies
      - bootstrapconfigs
      - kobestores
      - kobestores/status
      - cidrclaims
      - cidrclaims/status
      - cidrpools
      - cidrpools/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Sandbox admission reads administrator-owned pool definitions.
  - apiGroups: ["kobe.kunobi.ninja"]
    resources: ["sandboxpools"]
    verbs: ["get", "list", "watch"]
  # Sandbox callers create lease intent through the HTTP API. Lifecycle
  # controllers, not admission, own the status subresource — which needs its
  # own rule: `/status` is a separate resource to RBAC, so a controller with
  # `patch` on `sandboxleases` alone still 403s on every phase transition.
  - apiGroups: ["kobe.kunobi.ninja"]
    resources: ["sandboxleases", "sandboxleases/status"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  # Upstream Agent Sandbox objects, created and owned by the placement
  # controller. Kobe never installs these CRDs (`agentSandbox.mode=external`
  # means the operator owns the runtime); it only writes the objects it
  # created, all of which carry a `kobe-` name and an owner reference to their
  # Kobe parent. `delete` is what makes verified teardown possible: without it
  # a released lease could never prove its Sandbox was gone, and its capacity
  # would be withheld forever.
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools", "sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The upstream `Sandbox` object itself, in the CORE Agent Sandbox group.
  # Read-only: Kobe creates Sandboxes only indirectly, through claims. It is
  # read to find the Pod behind a claim, via upstream's own `status.selector`.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  # The readiness canary runs an administrator-declared command inside the
  # Sandbox. Upstream `Ready` describes the container, not the agent in it —
  # a crash-looped or wedged agent satisfies it, and believing it starts a
  # paid runtime TTL on a Sandbox that cannot serve.
  #
  # `pods/exec` is a powerful verb, so what bounds it matters: the argv comes
  # from the `SandboxPool` spec, which only an administrator can write, and a
  # lease selects a pool and nothing else. No caller input reaches this.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Sandbox log reads (#81). Separate from `pods` above because `pods/log` is
  # its own resource to RBAC — and worth stating explicitly: this is the verb
  # that lets the operator return a workload's own output to its lease holder.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Core resources for virtual cluster lifecycle
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts", "pods", "pods/status", "events", "persistentvolumeclaims", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Namespaces — the `vcluster` backend creates a per-instance host
  # namespace `vcluster-<instance>` (via SSA at create) and deletes it
  # at recycle to reap the entire vcluster Helm release in one shot.
  # Without `delete` here, the operator's recycle loop fails with 403
  # Forbidden and the pool gets stuck — observed at an internal cluster
  # during the first vkobe→vcluster migration attempt.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # PodDisruptionBudgets — the k3s backend creates a PDB for HA control
  # planes (servers>1) and deletes it on every recycle. Without these verbs
  # the recycle loop's `delete()` fails with 403 Forbidden (RBAC is checked
  # before existence, so even single-server instances that never had a PDB
  # get 403, not 404), the instance-cleanup finalizer is never removed, and
  # the whole pool wedges in Recycling — observed at an internal cluster after
  # #152 shipped the PDB management without the matching RBAC.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "jobs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # RBAC for kobe-sync sidecars
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Nodes (fake-node syncer)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Leader election, and the Sandbox admission ledger.
  #
  # `list` and `delete` are what teardown needs: a released lease is found by
  # its `sandbox-lease-uid` label (a LIST, because the controller holds the
  # lease and not the reservation names it created), and each reservation is
  # deleted under a UID precondition. Without both, a lease could be torn
  # down and still hold its quota slot, with nothing left to reconcile it.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # CRD discovery (Velero detection)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kobe.fullname" . }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kobe.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "kobe.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kobe.fullname" . }}-pool-publisher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kobe.fullname" . }}-pool-publisher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.poolPublisherServiceAccount | default (printf "%s-pool-publisher" (include "kobe.fullname" .)) }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "kobe.fullname" . }}-pool-publisher
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.hostReaper.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kobe-host-reaper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kobe.fullname" . }}-host-reaper
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kobe.kunobi.ninja"]
    resources: ["clusterinstances"]
    # `list` (not `get`) because the reaper's final safety check uses a
    # cluster-wide LIST with `fieldSelector=metadata.name=<name>`. A bare
    # `get` against `Api::all<T>` for a namespaced T is unreliable —
    # the cluster-scoped path 404s on namespaced resources.
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kobe.fullname" . }}-host-reaper
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kobe.fullname" . }}-host-reaper
subjects:
  - kind: ServiceAccount
    name: kobe-host-reaper
    namespace: {{ .Release.Namespace }}
{{- end }}
