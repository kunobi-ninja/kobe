{{- /*
  The child-cluster path uses the exact same release asset and image digest as
  the management path above. ClusterPools used by child SandboxPools must name
  this BootstrapConfig; Kobe validates its content digest before allocating.
*/ -}}
{{- if eq (.Values.agentSandbox.mode | default "disabled") "managed" }}
{{- $taggedImage := "registry.k8s.io/agent-sandbox/agent-sandbox-controller:v0.5.6" -}}
{{- $pinnedImage := "registry.k8s.io/agent-sandbox/agent-sandbox-controller@sha256:dc23fb0d5624c306ca2f8ef0d41848dba670ebaf62beb500f870175aec529ffd" -}}
{{- $release := .Files.Get "files/agent-sandbox-v0.5.6.yaml" | replace $taggedImage $pinnedImage -}}
apiVersion: kobe.kunobi.ninja/v1alpha1
kind: BootstrapConfig
metadata:
  name: agent-sandbox-v0-5-6
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kobe.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-sandbox-bootstrap
  annotations:
    kobe.kunobi.ninja/source-release: v0.5.6
    kobe.kunobi.ninja/source-sha256: 1696dbb6faded503149b3994badb599df5dcf24d5985466881784f442dd9c3e5
spec:
  files:
    agent-sandbox-v0.5.6.yaml: |
{{ $release | indent 6 }}
{{- end }}
