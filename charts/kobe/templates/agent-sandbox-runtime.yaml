{{- /*
  Agent Sandbox v0.5.6 managed runtime.

  Source asset:
  https://github.com/kubernetes-sigs/agent-sandbox/releases/download/v0.5.6/sandbox-with-extensions.yaml
  Upstream SHA-256: 1696dbb6faded503149b3994badb599df5dcf24d5985466881784f442dd9c3e5

  The release asset uses a tag. Kobe never emits that mutable reference: this
  template rewrites it to the immutable multi-platform OCI index digest. CRDs
  are retained on uninstall so Helm cannot silently delete Sandbox data.
*/ -}}
{{- if eq (.Values.agentSandbox.mode | default "disabled") "managed" }}
{{- $taggedImage := "registry.k8s.io/agent-sandbox/agent-sandbox-controller:v0.5.6" -}}
{{- $pinnedImage := "registry.k8s.io/agent-sandbox/agent-sandbox-controller@sha256:dc23fb0d5624c306ca2f8ef0d41848dba670ebaf62beb500f870175aec529ffd" -}}
{{- $release := .Files.Get "files/agent-sandbox-v0.5.6.yaml" | replace $taggedImage $pinnedImage -}}
{{- range $document := splitList "\n---\n" $release }}
{{- $resource := fromYaml $document }}
{{- if $resource }}
{{- if eq (get $resource "kind") "CustomResourceDefinition" }}
{{- $metadata := get $resource "metadata" }}
{{- $annotations := default (dict) (get $metadata "annotations") }}
{{- $_ := set $annotations "helm.sh/resource-policy" "keep" }}
{{- $_ := set $annotations "kobe.kunobi.ninja/source-release" "v0.5.6" }}
{{- $_ := set $annotations "kobe.kunobi.ninja/source-sha256" "1696dbb6faded503149b3994badb599df5dcf24d5985466881784f442dd9c3e5" }}
{{- $_ := set $metadata "annotations" $annotations }}
{{- end }}
---
{{ toYaml $resource }}
{{- end }}
{{- end }}
{{- end }}
