                      nullable: true
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0.0
                      nullable: true
                      type: integer
                    reason:
                      maxLength: 128
                      type: string
                    status:
