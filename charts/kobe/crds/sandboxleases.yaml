                - attemptId
                - verifiedAt
                type: object
              claimCleanupFence:
                description: Durable management-Claim deletion fence understood by this controller.
                enum:
                - AdmissionOnlyV1
                - FinalizerV1
                nullable: true
                type: string
              conditions:
