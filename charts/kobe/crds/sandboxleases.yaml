          rule: '!has(self.status) || self.status == null || !has(self.status.childTeardownMode) || (has(self.status.placement) && self.status.placement.type == ''childCluster'' && has(self.status.target) && has(self.status.target.childClusterKubeconfigSecret))'
        - message: a child teardown receipt acknowledgement requires child placement
          rule: '!has(self.status) || self.status == null || !has(self.status.childTeardownReceiptAcknowledgement) || (has(self.status.placement) && self.status.placement.type == ''childCluster'')'
        - message: a child teardown receipt acknowledgement requires FootprintAbsent=True in the same checkpoint
          rule: '!has(self.status) || self.status == null || !has(self.status.childTeardownReceiptAcknowledgement) || (has(self.status.conditions) && self.status.conditions.exists(c, c.type == ''FootprintAbsent'' && c.status == ''True''))'
        - message: spec.placementAuthority is immutable
          rule: '!has(oldSelf.spec.placementAuthority) ? !has(self.spec.placementAuthority) : (has(self.spec.placementAuthority) && self.spec.placementAuthority == oldSelf.spec.placementAuthority)'
        - message: spec.placementAuthority must identify a ClusterPool
          rule: '!has(self.spec.placementAuthority) || (self.spec.placementAuthority.apiVersion == ''kobe.kunobi.ninja/v1alpha1'' && self.spec.placementAuthority.kind == ''ClusterPool'')'
        - message: resolved placement must match the immutable admission placementAuthority
          rule: '!has(self.status) || self.status == null || !has(self.status.placement) || ((self.status.placement.type == ''management'' && !has(self.spec.placementAuthority)) || (self.status.placement.type == ''childCluster'' && (!has(self.spec.placementAuthority) || (self.status.placement.clusterPool.apiVersion == self.spec.placementAuthority.apiVersion && self.status.placement.clusterPool.kind == self.spec.placementAuthority.kind && self.status.placement.clusterPool.__namespace__ == self.spec.placementAuthority.__namespace__ && self.status.placement.clusterPool.name == self.spec.placementAuthority.name && self.status.placement.clusterPool.uid == self.spec.placementAuthority.uid && has(self.status.placement.clusterPool.generation) && self.status.placement.clusterPool.generation == self.spec.placementAuthority.generation))))'
        - message: child placement without placementAuthority may only preserve an exact legacy placement
          rule: '!(has(self.status) && self.status != null && has(self.status.placement) && self.status.placement.type == ''childCluster'' && !has(self.spec.placementAuthority)) || (has(oldSelf.status) && oldSelf.status != null && has(oldSelf.status.placement) && oldSelf.status.placement.type == ''childCluster'' && !has(oldSelf.spec.placementAuthority) && self.status.placement == oldSelf.status.placement)'
        - message: legacy child placement without placementAuthority may not be removed or changed
          rule: '!(has(oldSelf.status) && oldSelf.status != null && has(oldSelf.status.placement) && oldSelf.status.placement.type == ''childCluster'' && !has(oldSelf.spec.placementAuthority)) || (has(self.status) && self.status != null && has(self.status.placement) && self.status.placement.type == ''childCluster'' && !has(self.spec.placementAuthority) && self.status.placement == oldSelf.status.placement)'
        - message: child receipt token and immutable evidence must be checkpointed together
          rule: '!has(self.status) || self.status == null || (has(self.status.childTeardownReceiptAcknowledgement) == has(self.status.childTeardownEvidence))'
        - message: NeverBound and receipt checkpoints are mutually exclusive and require child placement
          rule: '!has(self.status) || self.status == null || !has(self.status.childUnboundReleaseProof) || (!has(self.status.childTeardownReceiptAcknowledgement) && !has(self.status.childTeardownEvidence) && has(self.status.placement) && self.status.placement.type == ''childCluster'')'
