apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxleases.kobe.kunobi.ninja
spec:
  group: kobe.kunobi.ninja
  names:
    categories: []
    kind: SandboxLease
    plural: sandboxleases
    shortNames:
    - sl
    singular: sandboxlease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SandboxLeaseSpec via `CustomResource`
        properties:
          spec:
            description: Caller-safe intent for one disposable Sandbox.
            properties:
              alias:
                minLength: 1
                nullable: true
                type: string
              placementAuthority:
                description: |-
                  Server-owned exact child `ClusterPool` identity copied from the admitted
                  [`SandboxPoolStatus`]. It is absent for management placement and may not
                  be added, removed, or changed after the `SandboxLease` CREATE. During a
                  rolling controller upgrade, replicas built before this field fail to
                  deserialize such leases and therefore fail closed; deploy the new reader
                  before any child admission is enabled.
                nullable: true
                properties:
                  apiVersion:
                    maxLength: 253
                    minLength: 1
                    type: string
                  generation:
                    format: int64
                    minimum: 1.0
                    type: integer
                  kind:
                    maxLength: 63
                    minLength: 1
                    type: string
                  name:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  namespace:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  uid:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - generation
                - kind
                - name
                - namespace
                - uid
                type: object
              poolRef:
                description: |-
                  Exact SandboxPool admitted by Kobe. UID and generation fence pool
                  recreation or mutation between HTTP admission and placement.
                properties:
                  generation:
                    format: int64
                    minimum: 1.0
                    type: integer
                  name:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  uid:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - generation
                - name
                - uid
                type: object
              requester:
                description: |-
                  Set by Kobe from the authenticated principal, never trusted from an HTTP
                  request body. Ownership uses the complete tuple, not the display
                  identity alone.
                properties:
                  identity:
                    minLength: 1
                    type: string
                  issuer:
                    minLength: 1
                    type: string
                  provider:
                    description: Stable configured authentication provider ID.
                    minLength: 1
                    type: string
                  type:
                    minLength: 1
                    type: string
                required:
                - identity
                - issuer
                - provider
                - type
                type: object
              ttl:
                minLength: 1
                type: string
            required:
            - poolRef
            - requester
            - ttl
            type: object
