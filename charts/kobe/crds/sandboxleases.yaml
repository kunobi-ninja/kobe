                      - 'False'
                      - Unknown
                      type: string
                    type:
                      maxLength: 63
                      minLength: 1
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: Set only when the upstream Sandbox becomes Ready.
                format: date-time
                nullable: true
                type: string
              extensionsCount:
                default: 0
                description: |-
                  Runtime TTL extensions already granted to this lease.

                  Monotonic and never reset: the budget is spent per lease, not per
                  reconcile or per API replica. Absent on leases admitted before
                  extension existed, which reads as zero.
                format: uint32
                minimum: 0.0
                type: integer
              observedGeneration:
                format: int64
                minimum: 0.0
                nullable: true
                type: integer
              phase:
                default: Pending
                description: |-
                  Stable public phases. `Released` and `Expired` are clean terminal states;
                  uncertain teardown remains `Quarantined` and continues consuming capacity.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Releasing
                - Released
                - Expired
                - Quarantined
                type: string
              placement:
                nullable: true
                properties:
                  clusterPool:
                    description: |-
                      Non-secret identity of one exact Kubernetes object. String fields use the
                      Kubernetes name/identity ceilings so root-level CEL comparisons have a
                      finite admission cost instead of being rejected by the API server.
                    properties:
                      apiVersion:
                        maxLength: 253
                        minLength: 1
                        type: string
                      generation:
                        format: int64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      kind:
                        maxLength: 63
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 63
                        minLength: 1
                        nullable: true
