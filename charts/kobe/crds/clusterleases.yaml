apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterleases.kobe.kunobi.ninja
spec:
  group: kobe.kunobi.ninja
  names:
    categories: []
    kind: ClusterLease
    plural: clusterleases
    shortNames:
    - cl
    singular: clusterlease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.cleanupMode
      name: Cleanup
      type: string
    - jsonPath: .status.teardownReceipt.outcome
      name: Receipt
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ClusterLeaseSpec via `CustomResource`
        properties:
          spec:
            description: |-
              ClusterLease is the internal representation of a cluster lease.

              Created when a user/CI leases a cluster via the HTTP API.
              The lease controller binds it to a warm cluster, tracks TTL,
              and handles release/expiry/recycling.
            properties:
              cleanupMode:
                description: How thoroughly a lease's capacity must be torn down before it can be reused.
                enum:
                - Standard
                - VerifiedDestroy
                nullable: true
                type: string
              poolRef:
                description: Which profile's pool to lease from.
                type: string
              priority:
                default: 50
                description: |-
                  Lease priority for queue ordering.
                  Higher values are served first.
                format: uint32
                minimum: 0.0
                type: integer
              requester:
                description: Identity of the requester.
                properties:
                  identity:
                    description: |-
                      Identity string (e.g. "repo:org/repo:ref:refs/heads/main" for GitHub,
                      or user ID for Clerk).
                    type: string
                  type:
                    description: 'Type of requester: "{provider}:{role}" (e.g. "github-actions:ci", "clerk:admin").'
                    type: string
                required:
                - identity
                - type
                type: object
              ttl:
                description: Requested TTL (e.g. "1h", "30m").
                type: string
            required:
            - poolRef
            - requester
            - ttl
            type: object
          status:
            nullable: true
            properties:
              binding:
                description: |-
                  Authoritative UID-fenced reciprocal binding. It may be present while the
                  lease is still `Pending` as a crash-safe reservation intent; access is
                  authorized only after the lease reaches `Bound` and the exact same value
                  exists on the referenced `ClusterInstance`.

                  A `VerifiedDestroy` intent is write-once. If release closes it before
                  token creation, the exact value remains alongside `NeverBound` proof so
                  consumers can distinguish "intent retained, instance absent" from "no
                  intent was ever recorded".

                  `clusterName` remains for compatibility and display, but must never be
                  used alone for access, mutation, rollback, release, or teardown.
                nullable: true
                properties:
                  backend:
                    description: |-
                      Immutable, non-secret data needed to select the backend that created an
                      instance without trusting the owning pool's mutable current spec.

                      `config_digest` covers the complete serialized [`BackendConfig`], including
                      backend-specific settings, while this status record stores only the bounded
                      dispatch fields needed after creation. Secret *values* are never copied;
                      configuration may contain Secret names, and the digest reveals no raw
                      credential material.
                    properties:
                      capi:
                        description: |-
                          CAPI discovery identity required to reconstruct delete dispatch.
                          Provider `infrastructureSpec` is deliberately excluded because it may
                          contain sensitive provider data and is not needed for dispatch.
                        nullable: true
                        properties:
                          infrastructureApiVersion:
                            type: string
                          infrastructureKind:
                            type: string
                          infrastructurePlural:
                            nullable: true
                            type: string
                        required:
                        - infrastructureApiVersion
                        - infrastructureKind
                        type: object
                      configDigest:
                        description: |-
                          SHA-256 of the canonical JSON serialization of the complete backend
                          configuration at creation/bind time. A changed pool backend therefore
                          cannot silently redirect access or teardown.
                        type: string
                      type:
                        description: Backend implementation that created the instance.
                        enum:
                        - k3s
                        - k0s
                        - capi
                        - vkobe
                        - vcluster
                        type: string
                    required:
                    - configDigest
                    - type
                    type: object
                  bindingId:
                    description: Random immutable identifier unique to this reservation attempt.
                    type: string
                  cleanupMode:
                    default: Standard
                    description: |-
                      Cleanup contract captured when the reservation was created.

                      This is authoritative for teardown. Reading the mutable lease spec at
                      teardown would allow a `VerifiedDestroy` lease to be downgraded after it
                      had used the capacity. `serde(default)` keeps legacy Standard bindings
                      readable, while the bind path writes this field for every new pair.
                    enum:
                    - Standard
                    - VerifiedDestroy
                    type: string
                  connectToken:
                    description: |-
                      Exact lease-scoped connect-token Secret created before access is
                      granted. Its UID is part of the reciprocal binding so a same-named
                      replacement is never accepted, and verified teardown must prove this
                      exact Secret absent before it can emit a terminal receipt.
                    nullable: true
                    properties:
                      apiVersion:
                        type: string
                      kind:
                        type: string
                      name:
                        type: string
                      namespace:
                        nullable: true
                        type: string
                      uid:
                        type: string
                    required:
                    - apiVersion
                    - kind
                    - name
                    - uid
                    type: object
                  creationManifest:
                    description: |-
                      The immutable manifest itself, retained with the lease so a receipt
                      consumer can reconstruct the controller-authenticated teardown scope
                      after the `ClusterInstance` has been deleted. Required together with
                      `creationManifestDigest` for `VerifiedDestroy`; absent for Standard.
                    nullable: true
                    properties:
                      agentReplicas:
                        format: uint32
                        minimum: 0.0
                        type: integer
                      backendType:
                        description: Which backend to use for cluster provisioning.
                        enum:
                        - k3s
                        - k0s
                        - capi
                        - vkobe
                        - vcluster
                        type: string
                      clusterCidr:
                        type: string
                      configDigest:
                        type: string
                      datastore:
                        properties:
                          database:
                            nullable: true
                            type: string
                          databaseOid:
                            nullable: true
                            type: string
                          endpointDigest:
                            description: SHA-256 of the non-secret connection location (scheme, host and port).
                            nullable: true
                            type: string
                          mode:
                            description: |-
                              Structural OpenAPI projection of [`DatastoreProvenance`]. Kubernetes CRDs
                              cannot express the tagged enum's two different `mode` constants in a single
                              structural property, so the schema keeps the fields optional and the
                              controller's [`TeardownCreationManifest::validate`] enforces the exact
                              mode-specific contract before the manifest is trusted.
                            enum:
                            - embeddedSqlite
                            - externalPostgres
                            type: string
                          role:
                            nullable: true
                            type: string
                          roleOid:
                            nullable: true
                            type: string
                          systemIdentifier:
                            description: Live `pg_control_system().system_identifier` of the PostgreSQL cluster.
                            nullable: true
                            type: string
                        required:
                        - mode
                        type: object
                      instance:
                        description: Reference to another Kobe-managed resource in the same namespace.
                        properties:
                          name:
                            description: |-
                              Resource name. Names are display and lookup handles, never sufficient
                              authority on their own because Kubernetes permits name reuse.
                            type: string
                          uid:
                            description: |-
                              Kubernetes UID of the referenced object. New controller-written
                              references always set this. `None` is accepted only so pre-UID-fence
                              objects remain readable; security-sensitive consumers must fail closed
                              or run the proof-based legacy migration before using the reference.
                            nullable: true
                            type: string
                        required:
                        - name
                        type: object
                      namespace:
                        type: string
                      resources:
                        items:
                          description: |-
                            One concrete Kubernetes resource created for the instance.

                            Repeating the same subject is intentional: it records multiplicity (for
                            example every server Pod and every PVC/PV) without weakening identity into a
                            selector or wildcard.
                          properties:
                            controlRelation:
                              description: How the live object proves the controller relationship.
                              enum:
                              - controllerOwner
                              - instanceUidLabel
                              - claimRef
                              type: string
                            controller:
                              description: Exact identity that controlled creation of this object.
                              properties:
                                apiVersion:
                                  type: string
                                kind:
                                  type: string
                                name:
                                  type: string
                                namespace:
                                  nullable: true
                                  type: string
                                uid:
                                  type: string
                              required:
                              - apiVersion
                              - kind
                              - name
                              - uid
                              type: object
                            resource:
                              description: |-
                                Exact identity of one Kubernetes object in a creation manifest.

                                Names are not identities: Kubernetes permits delete-and-recreate under the
                                same name. A UID is therefore mandatory for every recorded object, and a
                                receipt must account for the canonical identity rather than only its kind or
                                display name.
                              properties:
                                apiVersion:
                                  type: string
                                kind:
                                  type: string
                                name:
                                  type: string
                                namespace:
                                  nullable: true
                                  type: string
                                uid:
                                  type: string
                              required:
                              - apiVersion
                              - kind
                              - name
                              - uid
                              type: object
                            subject:
                              description: |-
                                One thing whose absence must be proven.

                                Enumerated rather than free-text so a receipt cannot be satisfied by an
                                unrecognised or invented subject, and so adding a resource to the teardown
                                path is a deliberate, reviewable change to this list.
                              enum:
                              - agentDeployment
                              - serverStatefulSet
                              - serverPods
                              - service
                              - podDisruptionBudget
                              - publisherConfigMap
                              - registriesConfigMap
                              - tokenSecret
                              - kubeconfigSecret
                              - cidrClaim
                              - connectTokenSecret
                              - datastoreCredentialSecret
                              - serverDataPvcs
                              - serverDataVolumes
                              - database
                              - databaseRole
                              type: string
                          required:
                          - controlRelation
                          - controller
                          - resource
                          - subject
                          type: object
                        type: array
                      schemaVersion:
                        format: uint32
                        minimum: 0.0
                        type: integer
                      sealedAt:
                        type: string
                      serverReplicas:
                        format: uint32
                        minimum: 0.0
                        type: integer
                      serviceCidr:
                        type: string
                      storage:
                        items:
                          description: |-
                            Live dynamic-storage facts captured while the PVC and PV are both bound.

                            The StorageClass is referenced by exact UID and its reclaim policy is copied
                            from the live object. A configured class name, a later lookup, or a boolean
                            assertion is not enough to prove that deleting the claim destroys its data.
                          properties:
                            pv:
                              description: |-
                                Exact identity of one Kubernetes object in a creation manifest.

                                Names are not identities: Kubernetes permits delete-and-recreate under the
                                same name. A UID is therefore mandatory for every recorded object, and a
                                receipt must account for the canonical identity rather than only its kind or
                                display name.
                              properties:
                                apiVersion:
                                  type: string
                                kind:
                                  type: string
                                name:
                                  type: string
                                namespace:
                                  nullable: true
                                  type: string
                                uid:
                                  type: string
                              required:
                              - apiVersion
                              - kind
                              - name
                              - uid
                              type: object
                            pvReclaimPolicy:
                              description: |-
                                `PersistentVolume.spec.persistentVolumeReclaimPolicy` observed from the
                                bound PV. The PV is the final authority for what happens to its data.
                              type: string
                            pvc:
                              description: |-
                                Exact identity of one Kubernetes object in a creation manifest.

                                Names are not identities: Kubernetes permits delete-and-recreate under the
                                same name. A UID is therefore mandatory for every recorded object, and a
                                receipt must account for the canonical identity rather than only its kind or
                                display name.
                              properties:
                                apiVersion:
                                  type: string
                                kind:
                                  type: string
                                name:
                                  type: string
                                namespace:
                                  nullable: true
                                  type: string
                                uid:
                                  type: string
                              required:
                              - apiVersion
                              - kind
                              - name
                              - uid
                              type: object
                            reclaimPolicy:
                              description: '`StorageClass.reclaimPolicy` observed from the live class.'
                              type: string
                            storageClass:
                              description: |-
                                Exact identity of one Kubernetes object in a creation manifest.

                                Names are not identities: Kubernetes permits delete-and-recreate under the
                                same name. A UID is therefore mandatory for every recorded object, and a
                                receipt must account for the canonical identity rather than only its kind or
                                display name.
                              properties:
                                apiVersion:
                                  type: string
                                kind:
                                  type: string
                                name:
                                  type: string
                                namespace:
                                  nullable: true
                                  type: string
                                uid:
                                  type: string
                              required:
                              - apiVersion
                              - kind
                              - name
                              - uid
                              type: object
                          required:
                          - pv
                          - pvReclaimPolicy
                          - pvc
                          - reclaimPolicy
                          - storageClass
                          type: object
                        type: array
                    required:
                    - agentReplicas
                    - backendType
                    - clusterCidr
                    - configDigest
                    - datastore
                    - instance
                    - namespace
                    - resources
                    - schemaVersion
                    - sealedAt
                    - serverReplicas
                    - serviceCidr
                    type: object
                  creationManifestDigest:
                    description: |-
                      Digest of the exact immutable creation manifest admitted at bind time.
                      Required when `cleanupMode=VerifiedDestroy`; absent for legacy Standard
                      bindings that predate creation manifests.
                    nullable: true
                    type: string
                  instance:
                    description: UID- and generation-fenced identity of the bound `ClusterInstance`.
                    properties:
                      name:
                        type: string
                      observedGeneration:
                        description: |-
                          `metadata.generation` observed before reservation. Any later spec
                          substitution invalidates the capability, even when name and UID remain.
                        format: int64
                        type: integer
                      uid:
                        type: string
                    required:
                    - name
                    - observedGeneration
                    - uid
                    type: object
                  instanceSpecDigest:
                    description: Instance creation/spec digest observed when the pair was bound.
                    type: string
                  lease:
                    description: Reference to another Kobe-managed resource in the same namespace.
                    properties:
                      name:
                        description: |-
                          Resource name. Names are display and lookup handles, never sufficient
                          authority on their own because Kubernetes permits name reuse.
                        type: string
                      uid:
                        description: |-
                          Kubernetes UID of the referenced object. New controller-written
                          references always set this. `None` is accepted only so pre-UID-fence
                          objects remain readable; security-sensitive consumers must fail closed
                          or run the proof-based legacy migration before using the reference.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  pool:
                    description: Reference to another Kobe-managed resource in the same namespace.
                    properties:
                      name:
                        description: |-
                          Resource name. Names are display and lookup handles, never sufficient
                          authority on their own because Kubernetes permits name reuse.
                        type: string
                      uid:
                        description: |-
                          Kubernetes UID of the referenced object. New controller-written
                          references always set this. `None` is accepted only so pre-UID-fence
                          objects remain readable; security-sensitive consumers must fail closed
                          or run the proof-based legacy migration before using the reference.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                required:
                - backend
                - bindingId
                - instance
                - instanceSpecDigest
                - lease
                - pool
                type: object
              boundAt:
                description: When the lease was bound to a vcluster.
                nullable: true
                type: string
              clusterName:
                description: Name of the bound cluster (set when phase=Bound).
                nullable: true
                type: string
              conditions:
                description: |-
                  Standard Kubernetes-style status conditions, derived by the lease
                  controller from `phase` / `cluster_name` / `message` (see
                  `derive_lease_conditions`). Mirrors `ClusterInstanceStatus.conditions`.
                  Currently emitted: `Bound` (True once a cluster is assigned) and
                  `Satisfiable` (False on the no-Ready-cluster path, carrying the
                  unsatisfiable reason). These give `kubectl` and ops tooling a familiar,
                  machine-readable surface for *why* the lease is where it is, alongside
                  the human-readable `message`.

                  `skip_serializing_if = "Vec::is_empty"` protects the list from
                  Merge-Patch erasure, same pattern as `message`: a writer that emits an
                  empty `Vec` (e.g. a status patch that only touches another field) must
                  omit the key entirely — otherwise a JSON Merge Patch carrying
                  `"conditions": []` would replace the on-disk list with an empty one
                  (RFC 7396 / array-replacement).
                items:
                  description: |-
                    One status condition on a `ClusterLease`. Mirrors the core/v1 condition
                    shape (type/status/reason/message/lastTransitionTime) — and
                    `ClusterInstanceCondition` — so kubectl and operators see a familiar
                    surface across all Kobe resources.
                  properties:
                    lastTransitionTime:
                      description: |-
                        RFC3339 of the last status change. Updated only when `status`
                        flips (True ↔ False ↔ Unknown), not on every reconcile, so tools
                        tailing `kubectl get -w` see meaningful transitions rather than churn.
                      nullable: true
                      type: string
                    message:
                      description: |-
                        Human-readable detail, generally a copy of `status.message` for the
                        current state (or empty when there is none).
                      type: string
                    reason:
                      description: |-
                        Machine-readable reason. For `Bound` this is the current phase
                        (e.g. `Bound`, `Pending`, `Expired`). For `Satisfiable` it is the
                        unsatisfiable classification (e.g. `Warming`, `PoolExhausted`) on the
                        no-Ready-cluster path, or the phase otherwise.
                      type: string
                    status:
                      description: 'One of: `True`, `False`, `Unknown`.'
                      type: string
                    type:
                      description: 'Condition name. Emitted values: `Bound`, `Satisfiable`.'
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connectTokenCreation:
                description: |-
                  Crash-safe state machine for creation of the lease-scoped connect
                  token. `Prepared` is persisted before the create-capable reconcile;
                  `Creating` is then persisted immediately before the one permitted
                  Secret `POST`.
                  `Reserved` records the exact Secret UID and closes the create name;
                  every later operation is an exact-UID `PATCH` or `DELETE`, never a
                  second create. Terminal release may certify `NeverBound` only after the
                  same attempt reaches `Closed` with an observed-absence timestamp.
                nullable: true
                properties:
                  attemptId:
                    minLength: 1
                    type: string
                  identity:
                    description: |-
                      Exact identity of one Kubernetes object in a creation manifest.

                      Names are not identities: Kubernetes permits delete-and-recreate under the
                      same name. A UID is therefore mandatory for every recorded object, and a
                      receipt must account for the canonical identity rather than only its kind or
                      display name.
                    nullable: true
                    properties:
                      apiVersion:
                        type: string
                      kind:
                        type: string
                      name:
                        type: string
                      namespace:
                        nullable: true
                        type: string
                      uid:
                        type: string
                    required:
                    - apiVersion
                    - kind
                    - name
                    - uid
                    type: object
                  phase:
                    description: Monotonic states for [`ConnectTokenCreation`].
                    enum:
                    - prepared
                    - creating
                    - reserved
                    - ready
                    - closing
                    - closed
                    type: string
                  verifiedAbsentAt:
                    format: date-time
                    nullable: true
                    type: string
                required:
                - attemptId
                - phase
                type: object
              diagnosticsUrl:
                description: URL to the diagnostic bundle captured on release.
                nullable: true
                type: string
              expiresAt:
                description: When the lease expires (TTL deadline).
                nullable: true
                type: string
              extensionsCount:
                default: 0
                description: Number of TTL extensions granted for this lease.
                format: uint32
                minimum: 0.0
                type: integer
              maxExtensions:
                default: 0
                description: Maximum number of extensions allowed (from policy).
                format: uint32
                minimum: 0.0
                type: integer
              message:
                description: |-
                  Human-readable explanation of the lease's current state, set when the
                  reason is non-obvious — primarily why a `Pending` lease has not bound
                  (e.g. "no Ready cluster; pool p phase=Failing, consecutiveFailures=3,
                  lastFailureReason=..."). Lets a client distinguish "warming up" from
                  "this pool will never satisfy me" without scraping pool status itself.

                  skip_serializing_if: omit when None so a JSON-Merge-Patch (RFC 7396)
                  pass-through preservation can't erase a previously-set message via an
                  explicit null.
                nullable: true
                type: string
              phase:
                default: Pending
                description: Current phase of the lease lifecycle.
                enum:
                - Pending
                - Bound
                - Released
                - Expired
                - Recycling
                - Quarantined
                type: string
              queuePosition:
                default: 0
                description: Position in the priority queue (0 = not queued, 1 = next).
                format: uint32
                minimum: 0.0
                type: integer
              teardownAcknowledgement:
                description: |-
                  Authority-owned proof that a distinct consumer durably checkpointed
                  this exact receipt or `NeverBound` attempt. The lifecycle controller
                  may remove the retention finalizer only when this value matches the
                  currently retained proof.
                nullable: true
                properties:
                  acknowledgedAt:
                    format: date-time
                    type: string
                  attemptId:
                    minLength: 1
                    type: string
                  consumer:
                    description: |-
                      Exact identity of one Kubernetes object in a creation manifest.

                      Names are not identities: Kubernetes permits delete-and-recreate under the
                      same name. A UID is therefore mandatory for every recorded object, and a
                      receipt must account for the canonical identity rather than only its kind or
                      display name.
                    properties:
                      apiVersion:
                        type: string
                      kind:
                        type: string
                      name:
                        type: string
                      namespace:
                        nullable: true
                        type: string
                      uid:
                        type: string
                    required:
                    - apiVersion
                    - kind
                    - name
                    - uid
                    type: object
                  proof:
                    description: Exact proof copied by the consumer before an authority may acknowledge it.
                    properties:
                      evidence:
                        description: Exact immutable evidence object checkpointed by a consumer before ACK.
                        nullable: true
                        properties:
                          generation:
                            format: int64
                            minimum: 1.0
                            type: integer
                          name:
                            minLength: 1
                            type: string
                          resourceVersion:
                            minLength: 1
                            type: string
                          uid:
                            minLength: 1
                            type: string
                        required:
                        - generation
                        - name
                        - resourceVersion
                        - uid
                        type: object
                      kind:
                        description: |-
                          Discriminator for [`TeardownAcknowledgedProof`]. The optional payload
                          fields intentionally live in one structural object: Kubernetes CRD schemas
                          cannot merge internally-tagged enum variants that give `kind` different
                          enum constraints. The `ClusterLease` CEL rule enforces the exact payload
                          for each variant.
                        enum:
                        - receipt
                        - neverBound
                        type: string
                      receiptToken:
                        maxLength: 71
                        minLength: 71
                        nullable: true
                        pattern: ^sha256:[0-9a-f]{64}$
                        type: string
                      unboundReleaseVerifiedAt:
                        format: date-time
                        nullable: true
                        type: string
                    required:
                    - kind
                    type: object
                required:
                - acknowledgedAt
                - attemptId
                - consumer
                - proof
                type: object
              teardownAttemptId:
                description: |-
                  Durable nonce written before the first destructive request. Kept
                  separate from the mutable InProgress-to-terminal receipt so consumers
                  can verify that the terminal record belongs to the exact attempt the
                  controller began, rather than trusting a nonce supplied by that record.
                minLength: 1
                nullable: true
                type: string
              teardownEvidence:
                description: |-
                  Exact immutable authority record corresponding to
                  [`Self::teardown_receipt`]. Consumers never trust the status mirror
                  without fetching this UID/generation/resourceVersion-fenced object.
                nullable: true
                properties:
                  generation:
                    format: int64
                    minimum: 1.0
                    type: integer
                  name:
                    minLength: 1
                    type: string
                  resourceVersion:
                    minLength: 1
                    type: string
                  uid:
                    minLength: 1
                    type: string
                required:
                - generation
                - name
                - resourceVersion
                - uid
                type: object
              teardownReceipt:
                description: |-
                  Durable proof that this lease's exact capacity was destroyed.

                  Recorded here rather than on the `ClusterInstance` because it must stay
                  queryable *after* the instance object is gone — which is exactly when
                  the evidence matters, and when #74's owning `SandboxLease` consumes it.
                nullable: true
                properties:
                  attemptId:
                    description: |-
                      Unique per attempt. Reconcile resumes an `InProgress` nonce unchanged;
                      a later retry may replace a terminal receipt with a new attempt, but it
                      never rewrites the identity of an active attempt.
                    type: string
                  backendType:
                    description: Backend identity and immutable provenance digest observed at bind time.
                    type: string
                  checks:
                    items:
                      description: Evidence for one subject.
                      properties:
                        reason:
                          description: |-
                            Bounded, non-secret reason code (e.g. `pv_still_present`,
                            `datastore_unreachable`). Never a raw provider response.
                          nullable: true
                          type: string
                        result:
                          description: Outcome of proving one subject absent.
                          enum:
                          - verified
                          - notApplicable
                          - unknown
                          type: string
                        subject:
                          description: |-
                            One thing whose absence must be proven.

                            Enumerated rather than free-text so a receipt cannot be satisfied by an
                            unrecognised or invented subject, and so adding a resource to the teardown
                            path is a deliberate, reviewable change to this list.
                          enum:
                          - agentDeployment
