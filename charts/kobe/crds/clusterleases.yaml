apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterleases.kobe.kunobi.ninja
spec:
  group: kobe.kunobi.ninja
  names:
    categories: []
    kind: ClusterLease
    plural: clusterleases
    shortNames:
    - cl
    singular: clusterlease
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ClusterLeaseSpec via `CustomResource`
        properties:
          spec:
            description: |-
              ClusterLease is the internal representation of a cluster lease.

              Created when a user/CI leases a cluster via the HTTP API.
              The lease controller binds it to a warm cluster, tracks TTL,
              and handles release/expiry/recycling.
            properties:
              cleanupMode:
                description: How thoroughly a lease's capacity must be torn down before it can be reused.
                enum:
                - Standard
                - VerifiedDestroy
                nullable: true
                type: string
              poolRef:
                description: Which profile's pool to lease from.
                type: string
              priority:
                default: 50
                description: |-
                  Lease priority for queue ordering.
                  Higher values are served first.
                format: uint32
                minimum: 0.0
                type: integer
              requester:
                description: Identity of the requester.
                properties:
                  identity:
                    description: |-
                      Identity string (e.g. "repo:org/repo:ref:refs/heads/main" for GitHub,
                      or user ID for Clerk).
                    type: string
                  type:
                    description: 'Type of requester: "{provider}:{role}" (e.g. "github-actions:ci", "clerk:admin").'
                    type: string
                required:
                - identity
                - type
                type: object
              ttl:
                description: Requested TTL (e.g. "1h", "30m").
                type: string
            required:
            - poolRef
            - requester
            - ttl
            type: object
          status:
            nullable: true
            properties:
              binding:
                description: |-
                  Authoritative UID-fenced reciprocal binding. It may be present while the
                  lease is still `Pending` as a crash-safe reservation intent; access is
                  authorized only after the lease reaches `Bound` and the exact same value
                  exists on the referenced `ClusterInstance`.

                  `clusterName` remains for compatibility and display, but must never be
                  used alone for access, mutation, rollback, release, or teardown.
                nullable: true
                properties:
                  backend:
                    description: |-
                      Immutable, non-secret data needed to select the backend that created an
                      instance without trusting the owning pool's mutable current spec.

                      `config_digest` covers the complete serialized [`BackendConfig`], including
                      backend-specific settings, while this status record stores only the bounded
                      dispatch fields needed after creation. Secret *values* are never copied;
                      configuration may contain Secret names, and the digest reveals no raw
                      credential material.
                    properties:
                      capi:
                        description: |-
                          CAPI discovery identity required to reconstruct delete dispatch.
                          Provider `infrastructureSpec` is deliberately excluded because it may
                          contain sensitive provider data and is not needed for dispatch.
                        nullable: true
                        properties:
                          infrastructureApiVersion:
                            type: string
                          infrastructureKind:
                            type: string
                          infrastructurePlural:
                            nullable: true
                            type: string
                        required:
                        - infrastructureApiVersion
                        - infrastructureKind
                        type: object
                      configDigest:
                        description: |-
                          SHA-256 of the canonical JSON serialization of the complete backend
                          configuration at creation/bind time. A changed pool backend therefore
                          cannot silently redirect access or teardown.
                        type: string
                      type:
                        description: Backend implementation that created the instance.
                        enum:
                        - k3s
                        - k0s
                        - capi
                        - vkobe
                        - vcluster
                        type: string
                    required:
                    - configDigest
                    - type
                    type: object
                  bindingId:
                    description: Random immutable identifier unique to this reservation attempt.
                    type: string
                  instance:
                    description: UID- and generation-fenced identity of the bound `ClusterInstance`.
                    properties:
                      name:
                        type: string
                      observedGeneration:
                        description: |-
                          `metadata.generation` observed before reservation. Any later spec
                          substitution invalidates the capability, even when name and UID remain.
                        format: int64
                        type: integer
                      uid:
                        type: string
                    required:
                    - name
                    - observedGeneration
                    - uid
                    type: object
                  instanceSpecDigest:
                    description: Instance creation/spec digest observed when the pair was bound.
                    type: string
                  lease:
                    description: Reference to another Kobe-managed resource in the same namespace.
                    properties:
                      name:
                        description: |-
                          Resource name. Names are display and lookup handles, never sufficient
                          authority on their own because Kubernetes permits name reuse.
                        type: string
                      uid:
                        description: |-
                          Kubernetes UID of the referenced object. New controller-written
                          references always set this. `None` is accepted only so pre-UID-fence
                          objects remain readable; security-sensitive consumers must fail closed
                          or run the proof-based legacy migration before using the reference.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  pool:
                    description: Reference to another Kobe-managed resource in the same namespace.
                    properties:
                      name:
                        description: |-
                          Resource name. Names are display and lookup handles, never sufficient
                          authority on their own because Kubernetes permits name reuse.
                        type: string
                      uid:
                        description: |-
                          Kubernetes UID of the referenced object. New controller-written
                          references always set this. `None` is accepted only so pre-UID-fence
                          objects remain readable; security-sensitive consumers must fail closed
                          or run the proof-based legacy migration before using the reference.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                required:
                - backend
                - bindingId
                - instance
                - instanceSpecDigest
                - lease
                - pool
                type: object
              boundAt:
                description: When the lease was bound to a vcluster.
                nullable: true
                type: string
              clusterName:
                description: Name of the bound cluster (set when phase=Bound).
                nullable: true
                type: string
              conditions:
                description: |-
                  Standard Kubernetes-style status conditions, derived by the lease
                  controller from `phase` / `cluster_name` / `message` (see
                  `derive_lease_conditions`). Mirrors `ClusterInstanceStatus.conditions`.
                  Currently emitted: `Bound` (True once a cluster is assigned) and
                  `Satisfiable` (False on the no-Ready-cluster path, carrying the
                  unsatisfiable reason). These give `kubectl` and ops tooling a familiar,
                  machine-readable surface for *why* the lease is where it is, alongside
                  the human-readable `message`.

                  `skip_serializing_if = "Vec::is_empty"` protects the list from
                  Merge-Patch erasure, same pattern as `message`: a writer that emits an
                  empty `Vec` (e.g. a status patch that only touches another field) must
                  omit the key entirely — otherwise a JSON Merge Patch carrying
                  `"conditions": []` would replace the on-disk list with an empty one
                  (RFC 7396 / array-replacement).
                items:
                  description: |-
                    One status condition on a `ClusterLease`. Mirrors the core/v1 condition
                    shape (type/status/reason/message/lastTransitionTime) — and
                    `ClusterInstanceCondition` — so kubectl and operators see a familiar
                    surface across all Kobe resources.
                  properties:
                    lastTransitionTime:
                      description: |-
                        RFC3339 of the last status change. Updated only when `status`
                        flips (True ↔ False ↔ Unknown), not on every reconcile, so tools
                        tailing `kubectl get -w` see meaningful transitions rather than churn.
                      nullable: true
                      type: string
                    message:
                      description: |-
                        Human-readable detail, generally a copy of `status.message` for the
                        current state (or empty when there is none).
                      type: string
                    reason:
                      description: |-
                        Machine-readable reason. For `Bound` this is the current phase
                        (e.g. `Bound`, `Pending`, `Expired`). For `Satisfiable` it is the
                        unsatisfiable classification (e.g. `Warming`, `PoolExhausted`) on the
                        no-Ready-cluster path, or the phase otherwise.
                      type: string
                    status:
                      description: 'One of: `True`, `False`, `Unknown`.'
                      type: string
                    type:
                      description: 'Condition name. Emitted values: `Bound`, `Satisfiable`.'
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              diagnosticsUrl:
                description: URL to the diagnostic bundle captured on release.
                nullable: true
                type: string
              expiresAt:
                description: When the lease expires (TTL deadline).
                nullable: true
                type: string
              extensionsCount:
                default: 0
                description: Number of TTL extensions granted for this lease.
                format: uint32
                minimum: 0.0
                type: integer
              maxExtensions:
                default: 0
                description: Maximum number of extensions allowed (from policy).
                format: uint32
                minimum: 0.0
                type: integer
              message:
                description: |-
                  Human-readable explanation of the lease's current state, set when the
                  reason is non-obvious — primarily why a `Pending` lease has not bound
                  (e.g. "no Ready cluster; pool p phase=Failing, consecutiveFailures=3,
                  lastFailureReason=..."). Lets a client distinguish "warming up" from
                  "this pool will never satisfy me" without scraping pool status itself.

                  skip_serializing_if: omit when None so a JSON-Merge-Patch (RFC 7396)
                  pass-through preservation can't erase a previously-set message via an
                  explicit null.
                nullable: true
                type: string
              phase:
                default: Pending
                description: Current phase of the lease lifecycle.
                enum:
                - Pending
                - Bound
                - Released
                - Expired
                - Recycling
                - Quarantined
                type: string
              queuePosition:
                default: 0
                description: Position in the priority queue (0 = not queued, 1 = next).
                format: uint32
                minimum: 0.0
                type: integer
              teardownReceipt:
                description: |-
                  Durable proof that this lease's exact capacity was destroyed.

                  Recorded here rather than on the `ClusterInstance` because it must stay
                  queryable *after* the instance object is gone — which is exactly when
                  the evidence matters, and when #74's owning `SandboxLease` consumes it.
                nullable: true
                properties:
                  attemptId:
                    description: Unique per attempt; retries produce new attempts, never edit old ones.
                    type: string
                  backendType:
                    description: Backend identity and immutable provenance digest observed at bind time.
                    type: string
                  checks:
                    items:
                      description: Evidence for one subject.
                      properties:
                        reason:
                          description: |-
                            Bounded, non-secret reason code (e.g. `pv_still_present`,
                            `datastore_unreachable`). Never a raw provider response.
                          nullable: true
                          type: string
                        result:
                          description: Outcome of proving one subject absent.
                          enum:
                          - verified
                          - notApplicable
                          - unknown
                          type: string
                        subject:
                          description: |-
                            One thing whose absence must be proven.

                            Enumerated rather than free-text so a receipt cannot be satisfied by an
                            unrecognised or invented subject, and so adding a resource to the teardown
                            path is a deliberate, reviewable change to this list.
                          enum:
                          - agentDeployment
                          - serverStatefulSet
                          - serverPods
                          - service
                          - podDisruptionBudget
                          - publisherConfigMap
                          - registriesConfigMap
                          - tokenSecret
                          - kubeconfigSecret
                          - cidrClaim
                          - connectTokenSecret
                          - serverDataPvcs
                          - serverDataVolumes
                          - database
                          - databaseRole
                          type: string
                        verified:
                          description: |-
                            The concrete resources this check actually looked at.

                            A [`TeardownSubject`] is a category. On its own,
                            `Database = Verified` asserts that *a* database is gone without saying
                            which — so a receipt could be satisfied by checking the wrong one, or by
                            checking one of several when the footprint had more. Recording the exact
                            identities makes the claim auditable after the fact, which is the whole
                            point of keeping evidence that outlives the instance.

                            Names only: object names, PV names, the database and role identifiers.
                            Never connection strings, credentials, or anything that would turn a
                            receipt into a secret.
                          items:
                            type: string
                          type: array
                      required:
                      - result
                      - subject
                      type: object
                    type: array
                  completedAt:
                    nullable: true
                    type: string
                  configDigest:
                    type: string
                  instance:
                    description: Reference to another Kobe-managed resource in the same namespace.
                    properties:
                      name:
                        description: |-
                          Resource name. Names are display and lookup handles, never sufficient
                          authority on their own because Kubernetes permits name reuse.
                        type: string
                      uid:
                        description: |-
                          Kubernetes UID of the referenced object. New controller-written
                          references always set this. `None` is accepted only so pre-UID-fence
                          objects remain readable; security-sensitive consumers must fail closed
                          or run the proof-based legacy migration before using the reference.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  instanceSpecDigest:
                    type: string
                  lease:
                    description: |-
                      Exact subjects this receipt is about. A same-named replacement is a
                      mismatch, not successful absence.
                    properties:
                      name:
                        description: |-
                          Resource name. Names are display and lookup handles, never sufficient
                          authority on their own because Kubernetes permits name reuse.
                        type: string
                      uid:
                        description: |-
                          Kubernetes UID of the referenced object. New controller-written
                          references always set this. `None` is accepted only so pre-UID-fence
                          objects remain readable; security-sensitive consumers must fail closed
                          or run the proof-based legacy migration before using the reference.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  outcome:
                    description: Aggregate verdict for one teardown attempt.
                    enum:
                    - verified
                    - quarantined
                    type: string
                  pool:
                    description: Reference to another Kobe-managed resource in the same namespace.
                    properties:
                      name:
                        description: |-
                          Resource name. Names are display and lookup handles, never sufficient
                          authority on their own because Kubernetes permits name reuse.
                        type: string
                      uid:
                        description: |-
                          Kubernetes UID of the referenced object. New controller-written
                          references always set this. `None` is accepted only so pre-UID-fence
                          objects remain readable; security-sensitive consumers must fail closed
                          or run the proof-based legacy migration before using the reference.
                        nullable: true
                        type: string
                    required:
                    - name
                    type: object
                  retryCount:
                    default: 0
                    format: uint32
                    minimum: 0.0
                    type: integer
                  schemaVersion:
                    description: |-
                      Schema version, so a consumer can refuse evidence it does not understand
                      rather than misread an older shape as complete.
                    format: uint32
                    minimum: 0.0
                    type: integer
                  startedAt:
                    type: string
                required:
                - attemptId
                - backendType
                - checks
                - configDigest
                - instance
                - instanceSpecDigest
                - lease
                - outcome
                - pool
                - schemaVersion
                - startedAt
                type: object
            type: object
        required:
        - spec
        title: ClusterLease
        type: object
    served: true
    storage: true
    subresources:
      status: {}
