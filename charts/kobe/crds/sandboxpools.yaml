apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxpools.kobe.kunobi.ninja
spec:
  group: kobe.kunobi.ninja
  names:
    categories: []
    kind: SandboxPool
    plural: sandboxpools
    shortNames:
    - sp
    singular: sandboxpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: integer
    - jsonPath: .status.allocated
      name: Allocated
      type: integer
    - jsonPath: .status.quarantined
      name: Quarantined
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SandboxPoolSpec via `CustomResource`
        properties:
          spec:
            description: |-
              Administrator-owned class of Agent Sandbox capacity.

              Root CRD CEL can couple the status generation markers to one another, but
              Kubernetes does not expose `metadata.generation` to CRD validation rules.
              The API and controllers therefore revalidate those markers against the
              live object's generation before they admit work or trust readiness.
            properties:
              defaultTtl:
                description: TTL used when a lease request omits one.
                minLength: 1
                type: string
              isolation:
                description: |-
                  Claimed workload-isolation mechanism. Hardened tiers carry the exact
                  administrator-selected RuntimeClass; leases cannot override it.
                properties:
                  runtimeClassName:
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  tier:
                    enum:
                    - trusted-runc
                    - gvisor
                    - kata
                    type: string
                required:
                - tier
                type: object
                x-kubernetes-validations:
                - message: trusted-runc must not set runtimeClassName; hardened tiers must set it
                  rule: (self.tier == 'trusted-runc' && !has(self.runtimeClassName)) || (self.tier in ['gvisor', 'kata'] && has(self.runtimeClassName))
              maxTtl:
                description: Maximum runtime TTL this pool will accept, independent of caller policy.
                minLength: 1
                type: string
              placement:
                description: |-
                  Exactly one target class. The tagged enum makes management and child
                  placement mutually exclusive in both JSON and generated OpenAPI.
                properties:
                  clusterPoolRef:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  type:
                    enum:
                    - management
                    - childCluster
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: management must not set clusterPoolRef; childCluster must set it
                  rule: (self.type == 'management' && !has(self.clusterPoolRef)) || (self.type == 'childCluster' && has(self.clusterPoolRef))
              provisioningTimeout:
                description: |-
                  Maximum time allowed for placement and Sandbox provisioning. Runtime TTL
                  starts only after readiness and is therefore separate from this deadline.
                minLength: 1
                type: string
              readiness:
                description: |-
                  Pool-specific execution canary used in addition to fixed controller
                  checks such as upstream readiness and runtime verification.
                properties:
                  canary:
                    properties:
                      argv:
                        description: |-
                          Direct argv vector; no implicit shell expansion. Certification may
                          execute this more than once after a controller crash or lost status
                          response, so the command must be idempotent and safe to retry.
                        items:
                          maxLength: 4096
                          minLength: 1
                          type: string
                        maxItems: 64
                        minItems: 1
                        type: array
                      timeout:
                        minLength: 1
                        type: string
                    required:
                    - argv
                    - timeout
                    type: object
                required:
                - canary
                type: object
              template:
                description: |-
                  Restricted template translated into the controller-owned upstream
                  `SandboxTemplate`; this is intentionally not a `PodSpec` escape hatch.
                properties:
                  containers:
                    description: |-
                      Complete bounded set of containers. Environment, mounts, security
                      context, service accounts, and arbitrary Pod fields are not exposed.
                    items:
                      description: One administrator-controlled container in a Sandbox template.
                      properties:
                        args:
                          default: []
                          items:
                            maxLength: 4096
                            type: string
                          maxItems: 256
                          type: array
                        command:
                          default: []
                          description: Executable and arguments, passed directly without an implicit shell.
                          items:
                            maxLength: 4096
                            minLength: 1
                            type: string
                          maxItems: 64
                          type: array
                        image:
                          maxLength: 2048
                          minLength: 1
                          type: string
                        name:
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        resources:
                          description: |-
                            Explicit requests and limits. CPU and memory are the only resource
                            dimensions admitted by the first Sandbox API, keeping quota comparison
                            deterministic and avoiding arbitrary extended-resource keys.
                          properties:
                            limits:
                              properties:
                                cpu:
                                  description: Kubernetes CPU quantity such as `500m` or `2`.
                                  minLength: 1
                                  type: string
                                ephemeralStorage:
                                  description: Kubernetes ephemeral-storage quantity such as `1Gi`.
                                  minLength: 1
                                  type: string
                                memory:
                                  description: Kubernetes memory quantity such as `512Mi` or `2Gi`.
                                  minLength: 1
                                  type: string
                              required:
                              - cpu
                              - ephemeralStorage
                              - memory
                              type: object
                            requests:
                              properties:
                                cpu:
                                  description: Kubernetes CPU quantity such as `500m` or `2`.
                                  minLength: 1
                                  type: string
                                ephemeralStorage:
                                  description: Kubernetes ephemeral-storage quantity such as `1Gi`.
                                  minLength: 1
                                  type: string
                                memory:
                                  description: Kubernetes memory quantity such as `512Mi` or `2Gi`.
                                  minLength: 1
                                  type: string
                              required:
                              - cpu
                              - ephemeralStorage
                              - memory
                              type: object
                          required:
                          - limits
                          - requests
                          type: object
                      required:
                      - image
                      - name
                      - resources
                      type: object
                    maxItems: 16
                    minItems: 1
                    type: array
                  defaultContainer:
                    description: Container selected by default for execution operations.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  exposedPorts:
                    default: []
                    description: |-
                      Ports that later access brokers may expose. Any undeclared port remains
                      unauthorized.
                    items:
                      description: One TCP port declared safe for later lease-scoped forwarding.
                      properties:
                        container:
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        name:
                          maxLength: 15
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        port:
                          format: uint16
                          maximum: 65535.0
                          minimum: 1.0
                          type: integer
                      required:
                      - container
                      - name
                      - port
                      type: object
                    maxItems: 64
                    type: array
                  runnerPath:
                    description: |-
                      Absolute path to `kobe-runner` inside `defaultContainer`, when the
                      administrator's image ships one.

                      Absent means this pool does not offer detached execution, and the API
                      says so rather than approximating it. A detached execution that actually
                      dies with its connection is worse than none, because the caller has
                      already built on the guarantee it appeared to offer.

                      A constrained path rather than free text: it becomes `argv[0]` of an
                      exec, so anything that could carry an argument, a shell metacharacter or
                      a nul is refused by the schema before it can reach one.
                    maxLength: 255
                    minLength: 1
                    nullable: true
                    pattern: ^/[A-Za-z0-9._/-]*$
                    type: string
                required:
                - containers
                - defaultContainer
                type: object
                x-kubernetes-validations:
                - message: defaultContainer must name one declared container
                  rule: self.containers.exists(c, c.name == self.defaultContainer)
                - message: container names must be unique
                  rule: self.containers.all(c, self.containers.filter(other, other.name == c.name).size() == 1)
                - message: every exposed port must name one declared container
                  rule: '!has(self.exposedPorts) || self.exposedPorts.all(p, self.containers.exists(c, c.name == p.container))'
                - message: exposed port names must be unique
                  rule: '!has(self.exposedPorts) || self.exposedPorts.all(p, self.exposedPorts.filter(other, other.name == p.name).size() == 1)'
                - message: a container port may be declared only once
                  rule: '!has(self.exposedPorts) || self.exposedPorts.all(p, self.exposedPorts.filter(other, other.container == p.container && other.port == p.port).size() == 1)'
                - message: exposed port names must contain a letter and cannot contain consecutive hyphens
                  rule: '!has(self.exposedPorts) || self.exposedPorts.all(p, p.name.matches(''.*[a-z].*'') && !p.name.contains(''--''))'
              warmCapacity:
                description: Desired number of unclaimed upstream Sandboxes kept warm.
                format: uint32
                maximum: 2147483647.0
                minimum: 0.0
                type: integer
            required:
            - defaultTtl
            - isolation
            - maxTtl
            - placement
            - provisioningTimeout
            - readiness
            - template
            - warmCapacity
            type: object
          status:
            nullable: true
            properties:
              allocated:
                default: 0
                description: |-
                  Admitted leases whose immutable pool UID matches this pool and whose
                  current phase consumes capacity.
                format: uint32
                minimum: 0.0
                type: integer
              certification:
                description: |-
                  Restart-safe certification attempt for this exact Pool generation.

                  The controller checkpoints object identities before crossing each
                  external side effect. A non-terminal attempt is deliberately retained:
                  abandoning its exact Claim or teardown fence would make a controller
                  restart capable of leaking capacity or admitting against stale proof.
                nullable: true
                properties:
                  baselineIdleSandboxUids:
                    description: |-
                      WarmPool-owned Sandbox UIDs present before the sacrificial Claim. Clean
                      replenishment must exclude the claimed Sandbox and preserve none of a
                      replaced generation's identities.
                    items:
                      maxLength: 128
                      minLength: 1
                      type: string
                    maxItems: 256
                    type: array
                  canaryPassedAt:
                    format: date-time
                    maxLength: 64
                    nullable: true
                    type: string
                  certifiedAt:
                    format: date-time
                    maxLength: 64
                    nullable: true
                    type: string
                  drainGeneration:
                    description: |-
                      WarmPool generation created by the post-fence scale-to-zero write. The
                      v0.5.6 `observedGeneration` ACK is meaningful only for this exact value.
                    format: int64
                    minimum: 1.0
                    nullable: true
                    type: integer
                  fingerprint:
                    description: |-
                      SHA-256 over the Pool UID/generation, exact Template/WarmPool identity,
                      pinned runtime version, and canonical canary requirements.
                    maxLength: 64
                    minLength: 64
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  message:
                    description: |-
                      Human-readable fail-closed reason. In `CleanupBlocked`, this is the
                      exact causal proof that the controller could not obtain.
                    maxLength: 4096
                    nullable: true
                    type: string
                  observedGeneration:
                    format: int64
                    minimum: 1.0
                    type: integer
                  persistentVolumeClaims:
                    description: |-
                      Exact PVC/PV identities seen before teardown. Empty means the closed
                      Pool template proved that no durable volumes can be created.
                    items:
                      description: |-
                        Non-secret identity of one exact Kubernetes object. String fields use the
                        Kubernetes name/identity ceilings so root-level CEL comparisons have a
                        finite admission cost instead of being rejected by the API server.
                      properties:
                        apiVersion:
                          maxLength: 253
                          minLength: 1
                          type: string
                        generation:
                          format: int64
                          minimum: 0.0
                          nullable: true
                          type: integer
                        kind:
                          maxLength: 63
                          minLength: 1
                          type: string
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          maxLength: 63
                          minLength: 1
                          nullable: true
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        uid:
                          maxLength: 128
                          minLength: 1
                          type: string
                      required:
                      - apiVersion
                      - kind
                      - name
                      - uid
                      type: object
                    maxItems: 16
                    type: array
                  persistentVolumes:
                    items:
                      description: |-
                        Non-secret identity of one exact Kubernetes object. String fields use the
                        Kubernetes name/identity ceilings so root-level CEL comparisons have a
                        finite admission cost instead of being rejected by the API server.
                      properties:
                        apiVersion:
                          maxLength: 253
                          minLength: 1
                          type: string
                        generation:
                          format: int64
                          minimum: 0.0
                          nullable: true
                          type: integer
                        kind:
                          maxLength: 63
                          minLength: 1
                          type: string
                        name:
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          maxLength: 63
                          minLength: 1
                          nullable: true
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        uid:
                          maxLength: 128
                          minLength: 1
                          type: string
                      required:
                      - apiVersion
                      - kind
                      - name
                      - uid
                      type: object
                    maxItems: 16
                    type: array
                  phase:
                    description: |-
                      Durable phase of one management-pool certification attempt.

                      `Certified` is the only phase that may accompany Pool `Ready=True`.
                      `CleanupBlocked` is fail-closed and retains every exact reference needed to
                      resume or investigate cleanup. Child placement does not use this state
                      until an equivalent in-child receipt protocol exists.
                    enum:
                    - initialized
                    - claimCreated
                    - workloadCaptured
                    - canaryPassed
                    - fenceInstalled
                    - drainAcknowledged
                    - claimDeleting
                    - absenceProven
                    - replenished
                    - fenceFinalizerRemoved
                    - fenceDeleting
                    - certified
                    - cleanupBlocked
                    type: string
                  pod:
                    description: |-
                      Non-secret identity of one exact Kubernetes object. String fields use the
                      Kubernetes name/identity ceilings so root-level CEL comparisons have a
                      finite admission cost instead of being rejected by the API server.
                    nullable: true
                    properties:
                      apiVersion:
                        maxLength: 253
                        minLength: 1
                        type: string
                      generation:
                        format: int64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      kind:
                        maxLength: 63
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 63
                        minLength: 1
                        nullable: true
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - apiVersion
                    - kind
                    - name
                    - uid
                    type: object
                  replenishGeneration:
                    description: WarmPool generation created when restoring the configured capacity.
                    format: int64
                    minimum: 1.0
                    nullable: true
                    type: integer
                  sandbox:
                    description: |-
                      Non-secret identity of one exact Kubernetes object. String fields use the
                      Kubernetes name/identity ceilings so root-level CEL comparisons have a
                      finite admission cost instead of being rejected by the API server.
                    nullable: true
                    properties:
                      apiVersion:
                        maxLength: 253
                        minLength: 1
                        type: string
                      generation:
                        format: int64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      kind:
                        maxLength: 63
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 63
                        minLength: 1
                        nullable: true
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - apiVersion
                    - kind
                    - name
                    - uid
                    type: object
                  sandboxClaim:
                    description: |-
                      Non-secret identity of one exact Kubernetes object. String fields use the
                      Kubernetes name/identity ceilings so root-level CEL comparisons have a
                      finite admission cost instead of being rejected by the API server.
                    nullable: true
                    properties:
                      apiVersion:
                        maxLength: 253
                        minLength: 1
                        type: string
                      generation:
                        format: int64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      kind:
                        maxLength: 63
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 63
                        minLength: 1
                        nullable: true
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - apiVersion
                    - kind
                    - name
                    - uid
                    type: object
                  sandboxTemplate:
                    description: |-
                      Non-secret identity of one exact Kubernetes object. String fields use the
                      Kubernetes name/identity ceilings so root-level CEL comparisons have a
                      finite admission cost instead of being rejected by the API server.
                    properties:
                      apiVersion:
                        maxLength: 253
                        minLength: 1
                        type: string
                      generation:
                        format: int64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      kind:
                        maxLength: 63
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 63
                        minLength: 1
                        nullable: true
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - apiVersion
                    - kind
                    - name
                    - uid
                    type: object
                  sandboxWarmPool:
                    description: |-
                      Non-secret identity of one exact Kubernetes object. String fields use the
                      Kubernetes name/identity ceilings so root-level CEL comparisons have a
                      finite admission cost instead of being rejected by the API server.
                    properties:
                      apiVersion:
                        maxLength: 253
                        minLength: 1
                        type: string
                      generation:
                        format: int64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      kind:
                        maxLength: 63
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 63
                        minLength: 1
                        nullable: true
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - apiVersion
                    - kind
                    - name
                    - uid
                    type: object
                  service:
                    description: |-
                      Non-secret identity of one exact Kubernetes object. String fields use the
                      Kubernetes name/identity ceilings so root-level CEL comparisons have a
                      finite admission cost instead of being rejected by the API server.
                    nullable: true
                    properties:
                      apiVersion:
                        maxLength: 253
                        minLength: 1
                        type: string
                      generation:
                        format: int64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      kind:
                        maxLength: 63
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 63
                        minLength: 1
                        nullable: true
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - apiVersion
                    - kind
                    - name
                    - uid
                    type: object
                  teardownFence:
                    description: Immutable parameter object for the teardown ValidatingAdmissionPolicy.
                    nullable: true
                    properties:
                      apiVersion:
                        maxLength: 253
                        minLength: 1
                        type: string
                      generation:
                        format: int64
                        minimum: 0.0
                        nullable: true
                        type: integer
                      kind:
                        maxLength: 63
                        minLength: 1
                        type: string
                      name:
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 63
                        minLength: 1
                        nullable: true
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      uid:
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - apiVersion
                    - kind
                    - name
                    - uid
                    type: object
                required:
                - fingerprint
                - observedGeneration
                - phase
                - sandboxTemplate
                - sandboxWarmPool
                type: object
                x-kubernetes-validations:
                - message: workload and later certification phases require exact Claim, Sandbox and Pod references
                  rule: self.phase in ['initialized', 'claimCreated', 'cleanupBlocked'] || (has(self.sandboxClaim) && has(self.sandbox) && has(self.pod))
                - message: post-fence certification phases require the exact teardown fence reference
                  rule: '!(self.phase in [''fenceInstalled'', ''drainAcknowledged'', ''claimDeleting'', ''absenceProven'', ''replenished'', ''fenceFinalizerRemoved'', ''fenceDeleting'', ''certified'']) || has(self.teardownFence)'
                - message: post-canary certification phases require the durable canary timestamp
                  rule: '!(self.phase in [''canaryPassed'', ''fenceInstalled'', ''drainAcknowledged'', ''claimDeleting'', ''absenceProven'', ''replenished'', ''fenceFinalizerRemoved'', ''fenceDeleting'', ''certified'']) || has(self.canaryPassedAt)'
                - message: Certified requires a durable certification timestamp
                  rule: self.phase != 'certified' || has(self.certifiedAt)
                - message: drain acknowledgement and later phases require the exact WarmPool drain generation
                  rule: '!(self.phase in [''drainAcknowledged'', ''claimDeleting'', ''absenceProven'', ''replenished'', ''fenceFinalizerRemoved'', ''fenceDeleting'', ''certified'']) || has(self.drainGeneration)'
                - message: replenishment and terminal phases require the exact restored WarmPool generation
                  rule: '!(self.phase in [''replenished'', ''fenceFinalizerRemoved'', ''fenceDeleting'', ''certified'']) || has(self.replenishGeneration)'
              conditions:
                description: |-
                  Current-generation pool certification. `Ready=True` authorizes new
                  leases; missing, stale, `False`, or `Unknown` conditions fail closed.
                  Replica counters alone never authorize admission.
                items:
                  description: |-
                    Kubernetes-style condition with the generation from which it was derived.
                    Status lists are capped because CEL lifecycle proofs scan them on every
                    status write.
                  properties:
                    lastTransitionTime:
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      format: int64
                      minimum: 0.0
                      nullable: true
                      type: integer
                    reason:
                      maxLength: 128
                      type: string
                    status:
                      description: Kubernetes Condition status values.
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      maxLength: 63
                      minLength: 1
                      type: string
                  required:
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                minimum: 0.0
                nullable: true
                type: integer
              placementAuthority:
                description: |-
                  Exact child `ClusterPool` proven composition-eligible for this Pool
                  generation. Management placement and ineligible child pools omit it.
                  This is discovery authority only: child `Ready` remains `False` until an
                  in-child certification and teardown receipt protocol exists.
                nullable: true
                properties:
                  apiVersion:
                    maxLength: 253
                    minLength: 1
                    type: string
                  generation:
                    format: int64
                    minimum: 1.0
                    type: integer
                  kind:
                    maxLength: 63
                    minLength: 1
                    type: string
                  name:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  namespace:
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  uid:
                    maxLength: 128
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - generation
                - kind
                - name
                - namespace
                - uid
                type: object
              quarantined:
                default: 0
                description: |-
                  Subset of `allocated` leases in the `Quarantined` phase. Quarantined
                  capacity remains allocated until its complete footprint is proven absent.
                format: uint32
                minimum: 0.0
                type: integer
              ready:
                default: 0
                description: |-
                  Clean, idle upstream Sandboxes reported by the exact reconciled
                  WarmPool's `readyReplicas`; allocated and quarantined capacity is not
